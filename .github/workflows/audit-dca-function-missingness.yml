name: Audit DCA 2025 function missingness from private R2

on:
  push:
    branches: [main]
    paths:
      - "pipeline/qa/audit_dca_function_missingness.py"
      - "data/mappings/dca_canonical_v1.yml"
      - ".github/workflows/audit-dca-function-missingness.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Recover approved Gate A 2025 raw artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/dca-audit/raw
          gh run download 37693005628 \
            --repo "$GITHUB_REPOSITORY" \
            --name sp645-full-dca-2025-raw \
            --dir build/dca-audit/raw
          test "$(find build/dca-audit/raw -name '*.json.gz' | wc -l)" -eq 1935
          test "$(find build/dca-audit/raw/i-e/2025 -name '*.json.gz' | wc -l)" -eq 645
      - name: Verify raw file tree against approved Gate A
        run: |
          python - <<'PY'
          from pathlib import Path
          from pipeline.acquire.siconfi_dca_state import raw_tree_sha256
          actual = raw_tree_sha256(Path("build/dca-audit/raw"))
          expected = "c95adaf62b87580125adda685f23363391f30fed8e8dca261529f37c1cef34f3"
          if actual != expected:
              raise SystemExit(f"Gate A raw-tree SHA mismatch: {actual}")
          print("Verified Gate A raw tree:", actual)
          PY
      - name: Audit DCA functions from original municipality files
        run: |
          python -m pipeline.qa.audit_dca_function_missingness \
            --raw-root build/dca-audit/raw \
            --year 2025 \
            --output build/dca-audit/qa_dca_function_missingness_2025.json
      - name: Upload private QA report (no raw fiscal sources)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp645-dca-function-missingness-2025
          path: |
            build/dca-audit/qa_dca_function_missingness_2025.json
            build/dca-audit/qa_dca_function_missingness_2025.csv
          if-no-files-found: warn
          retention-days: 30
