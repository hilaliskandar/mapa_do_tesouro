name: Bootstrap CI

on:
  pull_request:
  push:
    branches:
      - bootstrap-financas-municipais-sp

jobs:
  new-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install new-core dependencies
        run: |
          pip install -e . --no-deps
          pip install openpyxl pyyaml pytest
      - name: Compile new pipeline
        run: python -m compileall -q pipeline
      - name: Run new-core tests
        run: pytest -q tests
