name: Gerar boletins dos universos editoriais
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'editorial/multiuniverso/**'
      - '.github/workflows/build-editorial-universes.yml'
permissions:
  contents: read
  actions: read
jobs:
  gerar-boletins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar regras editoriais sem rede
        run: python editorial/multiuniverso/test_regras_editoriais.py
      - name: Recuperar API corrigida do build privado aprovado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/private-source
          gh run download 38905063653 --repo "$GITHUB_REPOSITORY" --name sp645-private-site-38905063653 --dir build/private-source
          test -f build/private-source/site-sp645/data/api/v1/publication/universes.json
          test -f build/private-source/qa_rgf_gate_e_integration.json
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("build/private-source/qa_rgf_gate_e_integration.json")
          data=json.loads(p.read_text())
          assert data["changed"]==3068 and data["reclassified_absent"]==802,data
          print("Base privada verificada:",data["changed"],data["reclassified_absent"])
          PY
      - name: Recuperar contextos e construir dez boletins
        run: |
          python editorial/multiuniverso/build_boletins.py --base "file://$PWD/build/private-source/site-sp645/data/api/v1" --out build/editorial-universes
          python editorial/multiuniverso/build_fichas.py --base "file://$PWD/build/private-source/site-sp645/data/api/v1" --out build/editorial-universes
      - name: Conferir resultados
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("build/editorial-universes")
          m=json.loads((p/"manifest.json").read_text())
          assert len(m["editions"]) == 10
          assert len(m["municipal_profiles"]) == 280
          assert len({x["publication_id"] for x in m["editions"]})==10
          for item in m["editions"]:
              assert (p/item["publication_id"]/"index.html").stat().st_size>300
          assert sum(1 for _ in (p/item["publication_id"]/"municipios").glob("*.html")) == item["member_count"]
          print("10 boletins produzidos; publicacao nao executada")
          PY
      - name: Auditar artefato editorial
        run: python editorial/multiuniverso/qa_artefato.py --out build/editorial-universes
      - name: Auditar dicionarios editoriais
        run: python editorial/multiuniverso/qa_dicionarios.py build/editorial-universes
      - name: Auditar dependencias e fontes de indicadores derivados
        run: python editorial/multiuniverso/qa_rastreabilidade.py build/editorial-universes
      - name: Conferir paridade dos valores municipais com o contexto da API
        run: python editorial/multiuniverso/qa_paridade_municipal.py --base "file://$PWD/build/private-source/site-sp645/data/api/v1" --out build/editorial-universes
      - name: Instalar navegador de homologação
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar navegação em computador e celular
        run: node editorial/multiuniverso/qa_browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: qa-navegador-editorial
          path: build/editorial-browser-qa/
      - uses: actions/upload-artifact@v4
        with:
          name: boletins-dez-universos
          path: build/editorial-universes/
          retention-days: 30
