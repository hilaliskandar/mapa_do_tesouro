name: Diagnose remote fiscal API v2 access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-v2-remote.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe remote v1 and v2 URLs
        run: |
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          python3 deployment/diagnose_v2_remote.py --base-url "https://preview.$CLOUDFLARE_PAGES_PROJECT.pages.dev" --report build/remote-v2-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: remote-v2-http-diagnostic
          path: build/remote-v2-diagnostic.json
