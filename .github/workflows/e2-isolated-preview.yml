name: E2 homologacao isolada Cloudflare Pages
on:
  pull_request:
    paths:
      - '.github/workflows/e2-isolated-preview.yml'
      - 'editorial/multiuniverso/build_private_preview_bundle.py'
      - 'editorial/multiuniverso/qa_http_preview.py'
      - 'editorial/multiuniverso/qa_http_all_editorial.py'
permissions:
  contents: read
  actions: read
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar pacote homologado e manter o escopo isolado
        run: |
          mkdir -p build/e2-preview
          gh run download 38921504732 --repo "$GITHUB_REPOSITORY" --name prepublicacao-e2-api-e-html --dir build/e2-preview
          test -f build/e2-preview/PREVIEW_MANIFEST.json
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path("build/e2-preview")
          m=json.loads((p/"PREVIEW_MANIFEST.json").read_text())
          assert m["public_deploy"] is False
          assert m["bulletins"]==10 and m["municipal_profiles"]==280
          for name,digest in m["files"].items():
              obj=p/name
              assert obj.is_file() and hashlib.sha256(obj.read_bytes()).hexdigest()==digest,name
          assert (p/"data/api/v1/publication/universes.json").is_file()
          print("PREVIEW_MANIFEST verified",len(m["files"]))
          PY
      - name: Publicar apenas no projeto separado de homologacao
        run: |
          npx --yes wrangler@4 pages deploy build/e2-preview \
            --project-name financas-e2-homologacao \
            --branch release-review \
            --commit-hash "$GITHUB_SHA"
      - name: Verificar HTTP externo e registrar causa em JSON
        run: |
          python editorial/multiuniverso/qa_http_preview.py \
            --out build/e2-preview-http/resultado.json
      - name: Publicar laudo HTTP mesmo em caso de bloqueio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-http-preview-e2
          path: build/e2-preview-http/resultado.json
          if-no-files-found: warn
      - name: Conferir HTTP e SHA dos dez boletins e 280 fichas
        run: |
          python editorial/multiuniverso/qa_http_all_editorial.py \
            --bundle build/e2-preview \
            --out build/e2-preview-http/all-editorial.json
      - name: Preservar auditoria integral de acesso externo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-http-all-editorial-e2
          path: build/e2-preview-http/all-editorial.json
          if-no-files-found: warn
      - name: Registrar links de revisao
        run: |
          echo "Projeto exclusivo: https://financas-e2-homologacao.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
          echo "Boletins: /publicacoes/; fontes API: /data/api/v1/" >> "$GITHUB_STEP_SUMMARY"
          echo "Nao modificar finbra-tic-tim-referencia nem financas-rmj." >> "$GITHUB_STEP_SUMMARY"
