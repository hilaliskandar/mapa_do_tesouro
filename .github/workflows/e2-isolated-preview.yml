name: E2 homologacao isolada Cloudflare Pages
on:
  pull_request:
    paths:
      - '.github/workflows/e2-isolated-preview.yml'
      - 'editorial/multiuniverso/build_private_preview_bundle.py'
permissions:
  contents: read
  actions: read
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar pacote homologado e manter o escopo isolado
        run: |
          mkdir -p build/e2-preview
          gh run download 38921504732 --repo "$GITHUB_REPOSITORY" --name prepublicacao-e2-api-e-html --dir build/e2-preview
          test -f build/e2-preview/PREVIEW_MANIFEST.json
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path("build/e2-preview")
          m=json.loads((p/"PREVIEW_MANIFEST.json").read_text())
          assert m["public_deploy"] is False
          assert m["bulletins"]==10 and m["municipal_profiles"]==280
          for name,digest in m["files"].items():
              obj=p/name
              assert obj.is_file() and hashlib.sha256(obj.read_bytes()).hexdigest()==digest,name
          assert (p/"data/api/v1/publication/universes.json").is_file()
          print("PREVIEW_MANIFEST verified",len(m["files"]))
          PY
      - name: Publicar apenas no projeto separado de homologacao
        run: |
          npx --yes wrangler@4 pages deploy build/e2-preview \
            --project-name financas-e2-homologacao \
            --branch revision-e2-20261016 \
            --commit-hash "$GITHUB_SHA"
      - name: Verificar resposta HTTP da API e de paginas publicadas
        run: |
          BASE="https://revision-e2-20261016.financas-e2-homologacao.pages.dev"
          python - <<'PY'
          import json,urllib.request,time
          root="https://revision-e2-20261016.financas-e2-homologacao.pages.dev"
          paths=[
           "/data/api/v1/publication/universes.json",
           "/publicacoes/RM_SAO_PAULO/index.html",
          ]
          for path in paths:
           for attempt in range(6):
            try:
             with urllib.request.urlopen(root+path,timeout=30) as response:
              raw=response.read()
              if response.status!=200 or not raw:raise ValueError("Resposta vazia ou invalida")
              if path.endswith(".json"):json.loads(raw)
              elif b"<html" not in raw.lower():raise ValueError("HTML invalido")
              print(path,response.status,len(raw))
              break
            except Exception:
             if attempt==5:raise
             time.sleep(10)
          PY
      - name: Registrar links de revisao
        run: |
          echo "Projeto exclusivo: https://financas-e2-homologacao.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
          echo "Boletins: /publicacoes/; fontes API: /data/api/v1/" >> "$GITHUB_STEP_SUMMARY"
          echo "Nao modificar finbra-tic-tim-referencia nem financas-rmj." >> "$GITHUB_STEP_SUMMARY"
