name: FED00 - auditar itens de transferencia STN SP645 sem somas
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fed00-stn-item-classification-qa.yml"
      - "pipeline/qa/audit_stn_transfer_items.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classify-source-items:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned candidate (read-only)
        run: |
          python3 deployment/download_r2_source.py \
            --object-key sp_645/federal/stn/2026_09/candidates/STN_SP645_ITEMS_2026_09_FROM_097638ce.csv \
            --output build/fed00-stn-classification/stn_sp645.csv \
            --expected-sha256 3b9b5bf22748579a0f90912c160159b8d50a7664294a750fc74b2f98a59657fb
      - name: Profile literal transfer and item pairs without summing decendial amounts
        run: |
          python3 -m pipeline.qa.audit_stn_transfer_items \
            --input build/fed00-stn-classification/stn_sp645.csv \
            --matrix build/fed00-stn-classification/STN_SP645_MATRIZ_RUBRICAS_2026_09.csv \
            --qa build/fed00-stn-classification/QA_STN_SP645_RUBRICAS_2026_09.json
      - name: Upload classification review only to existing private R2
        run: |
          SHA="$(python3 -c 'import json; print(json.load(open("build/fed00-stn-classification/QA_STN_SP645_RUBRICAS_2026_09.json"))["matrix_sha256"])')"
          python3 deployment/upload_r2_source.py \
            --source build/fed00-stn-classification/STN_SP645_MATRIZ_RUBRICAS_2026_09.csv \
            --object-key sp_645/federal/stn/2026_09/candidates/STN_SP645_MATRIZ_RUBRICAS_2026_09.csv \
            --expected-sha256 "$SHA" \
            --content-type text/csv
          python3 deployment/upload_r2_source.py \
            --source build/fed00-stn-classification/QA_STN_SP645_RUBRICAS_2026_09.json \
            --object-key sp_645/federal/stn/2026_09/candidates/QA_STN_SP645_RUBRICAS_2026_09_${{ github.run_id }}.json \
            --content-type application/json
          python3 deployment/download_r2_source.py \
            --object-key sp_645/federal/stn/2026_09/candidates/STN_SP645_MATRIZ_RUBRICAS_2026_09.csv \
            --output build/fed00-stn-classification/readback.csv \
            --expected-sha256 "$SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fed00-stn-sp645-classification-${{ github.run_id }}
          path: |
            build/fed00-stn-classification/STN_SP645_MATRIZ_RUBRICAS_2026_09.csv
            build/fed00-stn-classification/QA_STN_SP645_RUBRICAS_2026_09.json
          retention-days: 30
          if-no-files-found: warn
