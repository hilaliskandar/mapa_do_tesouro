name: FED00 - preservar snapshot STN 2026-09 no R2 canonico
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fed00-stn-source-r2.yml"
      - "pipeline/acquire/archive_stn_monthly_snapshot.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-verified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify immutable STN source using official resource ID
        run: |
          python3 -m pipeline.acquire.archive_stn_monthly_snapshot \
            --source-output build/fed00-stn-source/STN_MUNICIPIOS_2026_09_097638ce.csv \
            --report-output build/fed00-stn-source/QA_STN_SOURCE_2026_09.json
      - name: Persist original source and QA in existing R2 (never SQLite)
        run: |
          python3 deployment/upload_r2_source.py \
            --source build/fed00-stn-source/STN_MUNICIPIOS_2026_09_097638ce.csv \
            --object-key sp_645/federal/stn/2026_09/source/STN_MUNICIPIOS_2026_09_097638ce.csv \
            --content-type text/csv \
            --expected-sha256 097638cec48145ac0f509d526be49d40929d177ef3a2ae3b7f77c0acd990cf24
          python3 deployment/upload_r2_source.py \
            --source build/fed00-stn-source/QA_STN_SOURCE_2026_09.json \
            --object-key sp_645/federal/stn/2026_09/source/QA_STN_SOURCE_2026_09_${{ github.run_id }}.json \
            --content-type application/json
      - name: Verify original source readback SHA256
        run: |
          python3 deployment/download_r2_source.py \
            --object-key sp_645/federal/stn/2026_09/source/STN_MUNICIPIOS_2026_09_097638ce.csv \
            --output build/fed00-stn-source/readback.csv \
            --expected-sha256 097638cec48145ac0f509d526be49d40929d177ef3a2ae3b7f77c0acd990cf24
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fed00-stn-source-r2-qa-${{ github.run_id }}
          path: build/fed00-stn-source/QA_STN_SOURCE_2026_09.json
          retention-days: 30
          if-no-files-found: warn
