name: FED00 - normalizar snapshot STN SP645 como candidato reversivel
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fed00-stn-staging-sp645.yml"
      - "pipeline/normalize/prepare_stn_sp645_items.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-sp645:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve pinned national source and validated municipal crosswalk
        run: |
          python3 deployment/download_r2_source.py \
            --object-key sp_645/federal/stn/2026_09/source/STN_MUNICIPIOS_2026_09_097638ce.csv \
            --output build/fed00-staging/source.csv \
            --expected-sha256 097638cec48145ac0f509d526be49d40929d177ef3a2ae3b7f77c0acd990cf24
          python3 deployment/download_r2_source.py \
            --object-key sp_645/federal/stn/2026_09/candidates/STN_IBGE_SP_MATCH_CANDIDATE_20c80f6464de.csv \
            --output build/fed00-staging/crosswalk.csv \
            --expected-sha256 20c80f6464de30f899430327db569fd7a52610c14bfc88678b769638572f036c
      - name: Produce auditable SP645 item-level candidate (no monetary aggregation)
        run: |
          python3 -m pipeline.normalize.prepare_stn_sp645_items \
            --source build/fed00-staging/source.csv \
            --crosswalk build/fed00-staging/crosswalk.csv \
            --output build/fed00-staging/STN_SP645_ITEMS_2026_09.csv \
            --qa build/fed00-staging/QA_STN_SP645_ITEMS_2026_09.json
      - name: Verify candidate manifest and upload to existing R2
        run: |
          SHA="$(python3 -c 'import json;print(json.load(open("build/fed00-staging/QA_STN_SP645_ITEMS_2026_09.json"))["output_sha256"])')"
          test -n "$SHA"
          python3 deployment/upload_r2_source.py \
            --source build/fed00-staging/STN_SP645_ITEMS_2026_09.csv \
            --object-key sp_645/federal/stn/2026_09/candidates/STN_SP645_ITEMS_2026_09_FROM_097638ce.csv \
            --content-type text/csv \
            --expected-sha256 "$SHA"
          python3 deployment/upload_r2_source.py \
            --source build/fed00-staging/QA_STN_SP645_ITEMS_2026_09.json \
            --object-key sp_645/federal/stn/2026_09/candidates/QA_STN_SP645_ITEMS_2026_09_${{ github.run_id }}.json \
            --content-type application/json
          python3 deployment/download_r2_source.py \
            --object-key sp_645/federal/stn/2026_09/candidates/STN_SP645_ITEMS_2026_09_FROM_097638ce.csv \
            --output build/fed00-staging/readback.csv \
            --expected-sha256 "$SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fed00-stn-sp645-staging-qa-${{ github.run_id }}
          path: build/fed00-staging/QA_STN_SP645_ITEMS_2026_09.json
          retention-days: 30
          if-no-files-found: warn
