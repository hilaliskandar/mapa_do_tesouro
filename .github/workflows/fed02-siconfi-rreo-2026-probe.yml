name: 'FED02 - SICONFI RREO 2026 FPM FUNDEB sentinelas'
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fed02-siconfi-rreo-2026-probe.yml"
      - "pipeline/acquire/probe_siconfi_rreo_fpm_fundeb_2026.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-rreo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query official municipal RREO 2026 at most once per second
        run: |
          python3 -m pipeline.acquire.probe_siconfi_rreo_fpm_fundeb_2026 \
            --output build/fed02-rreo/QA_SICONFI_RREO_2026_FPM_FUNDEB.json
      - name: Persist public metadata QA in canonical private R2 (no accounting values)
        run: |
          SHA="$(python3 -c 'import hashlib;print(hashlib.sha256(open("build/fed02-rreo/QA_SICONFI_RREO_2026_FPM_FUNDEB.json","rb").read()).hexdigest())')"
          python3 deployment/upload_r2_source.py \
            --source build/fed02-rreo/QA_SICONFI_RREO_2026_FPM_FUNDEB.json \
            --object-key sp_645/federal/siconfi/rreo/2026/candidates/QA_FPM_FUNDEB_SENTINELAS_${{ github.run_id }}.json \
            --expected-sha256 "$SHA" \
            --content-type application/json
          python3 deployment/download_r2_source.py \
            --object-key sp_645/federal/siconfi/rreo/2026/candidates/QA_FPM_FUNDEB_SENTINELAS_${{ github.run_id }}.json \
            --output build/fed02-rreo/readback.json \
            --expected-sha256 "$SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fed02-rreo-public-metadata-${{ github.run_id }}
          path: build/fed02-rreo/QA_SICONFI_RREO_2026_FPM_FUNDEB.json
          retention-days: 30
          if-no-files-found: warn
