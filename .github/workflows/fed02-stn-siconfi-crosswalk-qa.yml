name: FED02 - STN SICONFI matrix QA (no accounting promotion)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fed02-stn-siconfi-crosswalk-qa.yml"
      - "pipeline/qa/audit_stn_siconfi_crosswalk_matrix.py"
      - "governance/MATRIZ_STN_SICONFI_CROSSWALK_RUBRICAS_2026_09.csv"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read verified STN SP645 candidate from existing R2
        run: |
          python3 deployment/download_r2_source.py \
            --object-key sp_645/federal/stn/2026_09/candidates/STN_SP645_ITEMS_2026_09_FROM_097638ce.csv \
            --output build/fed02/stn_sp645.csv \
            --expected-sha256 3b9b5bf22748579a0f90912c160159b8d50a7664294a750fc74b2f98a59657fb
      - name: Check exhaustive class-item coverage and reject guessed DCA codes
        run: |
          python3 -m pipeline.qa.audit_stn_siconfi_crosswalk_matrix \
            --source build/fed02/stn_sp645.csv \
            --matrix governance/MATRIZ_STN_SICONFI_CROSSWALK_RUBRICAS_2026_09.csv \
            --qa build/fed02/QA_STN_SICONFI_CROSSWALK_2026_09.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fed02-stn-siconfi-mapping-qa-${{ github.run_id }}
          path: build/fed02/QA_STN_SICONFI_CROSSWALK_2026_09.json
          retention-days: 30
          if-no-files-found: warn
