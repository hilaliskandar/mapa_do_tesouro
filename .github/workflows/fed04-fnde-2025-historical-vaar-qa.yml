name: FED04 - previous 2025 VAAR FNDE PDFs
on:
  pull_request:
    branches: [main]
    paths:
      - "pipeline/qa/probe_fnde_2025_historico_vaar.py"
      - ".github/workflows/fed04-fnde-2025-historical-vaar-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF text parser
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Inspect prior 2025 VAAR beneficiary lists
        run: python -m pipeline.qa.probe_fnde_2025_historico_vaar
      - name: Save only QA JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fed04-fnde-2025-previous-vaar-${{ github.run_id }}
          path: build/fed04-fnde-2025-history/QA_FED04_FNDE_2025_PREVIOUS_PUBLICATIONS.json
          if-no-files-found: warn
          retention-days: 30
