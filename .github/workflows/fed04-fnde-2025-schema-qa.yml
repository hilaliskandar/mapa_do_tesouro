name: FED04 - FNDE Fundeb 2025 CSV schema QA

on:
  pull_request:
    branches: [main]
    paths:
      - "pipeline/qa/probe_fnde_fundeb_2025_csv.py"
      - ".github/workflows/fed04-fnde-2025-schema-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official FNDE files and audit schema
        run: python -m pipeline.qa.probe_fnde_fundeb_2025_csv
      - name: Upload only QA JSON without reproducing FNDE datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fed04-fnde-fundeb-2025-qa-${{ github.run_id }}
          path: build/fed04-fnde/QA_FNDE_FUNDEB_2025_PUBLICACAO_6.json
          if-no-files-found: warn
          retention-days: 30
