name: Federal Public APIs - Isolated Live Smoke

on:
  pull_request:
    paths:
      - "pipeline/acquire/federal_public_api.py"
      - "tests/test_federal_public_api_live.py"
      - ".github/workflows/federal-public-api-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-get-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal requirements
        run: python -m pip install pytest
      - name: Verify isolated HTTP GET against public endpoints
        env:
          FEDERAL_API_LIVE_SMOKE: "1"
        run: python -m pytest -q -s tests/test_federal_public_api_live.py
