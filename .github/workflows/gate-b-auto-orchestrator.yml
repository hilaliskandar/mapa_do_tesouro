name: Gate B DCA Auto Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "data/catalogs/dca_sp_delta_queue.yml"
      - ".github/workflows/gate-b-auto-orchestrator.yml"
      - "pipeline/acquire/dca_delta_batch.py"

permissions:
  contents: write

concurrency:
  group: gate-b-dca-auto-orchestrator
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Download pinned SP municipality geometry
        run: |
          mkdir -p build
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/tbrugz/geodata-br/c39dfb040bfd466fe2a476bafed00749c5c42f16/geojson/geojs-35-mun.json" \
            --output build/sp.geojson

      - name: Process pending Gate B queue
        run: |
          python -m pipeline.acquire.dca_delta_batch \
            --queue data/catalogs/dca_sp_delta_queue.yml \
            --geojson build/sp.geojson \
            --output-root build/raw/delta \
            --normalized-root build/normalized \
            --qa-root governance/auto \
            --run-id "$GITHUB_RUN_ID" \
            --min-interval 1.05 \
            --max-cycles 10 \
            --summary build/gate-b-batch-summary.json

      - name: Upload batch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gate-b-auto-batch-${{ github.run_id }}
          path: |
            build/raw/delta
            build/normalized
            build/gate-b-batch-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit safe governance updates
        run: |
          if git diff --quiet -- data/catalogs/dca_sp_delta_queue.yml governance/auto/; then
            echo "No queue or QA changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogs/dca_sp_delta_queue.yml governance/auto/
          git commit -m "gate-b: process automatic DCA delta batch"
          git push origin HEAD:main

      - name: Publish summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("build/gate-b-batch-summary.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("### Gate B auto orchestrator\n\n")
              out.write(f"- cycles processed: {result['cycles']}\n")
              out.write(f"- queue empty: {result['queue_empty']}\n")
              out.write(f"- stopped for review: {result['stopped_for_review']}\n")
              for item in result["results"]:
                  out.write(
                      f"- {item['year']}: {item['classification']}; "
                      f"pairs={item['pair_count']}; "
                      f"empty={item['empty_source_pairs']}; "
                      f"sha256={item['normalized_sha256']}\n"
                  )
          PY
