name: Gate C RGF Sharded Postprocess

on:
  workflow_run:
    workflows: ["Gate C RGF SP645 Sharded"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  qa:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RGF_YEAR: "2025"
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download combined shard artifact
        uses: actions/download-artifact@v4
        with:
          name: gate-c-rgf-2025-combined
          path: build/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Render QA from combined shard summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from pipeline.qa.rgf_shards import write_qa

          summary = json.loads(
              Path("build/source/build/rgf_2025_shard_summary.json")
              .read_text(encoding="utf-8")
          )
          output = Path(
              "governance/auto/"
              f"QA_GATE_C_RGF_SP645_2025_SHARDED_RUN_{os.environ['SOURCE_RUN_ID']}.md"
          )
          write_qa(summary, output, year=2025)
          PY

      - name: Record source run metadata
        run: |
          cat > "governance/auto/RGF_SP645_2025_SHARDED_RUN_${SOURCE_RUN_ID}.json" <<EOF
          {
            "source_run_id": "${SOURCE_RUN_ID}",
            "year": 2025,
            "artifact": "gate-c-rgf-2025-combined",
            "source_workflow": "Gate C RGF SP645 Sharded"
          }
          EOF

      - name: Commit safe QA update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/auto/
          if git diff --cached --quiet; then
            echo "No QA changes to commit."
            exit 0
          fi
          git commit -m "gate-c: record sharded statewide RGF 2025 QA"
          git push origin HEAD:main
