name: Gate C RGF02 SP645

on:
  workflow_dispatch:
    inputs:
      year:
        description: "RGF Annex 02 exercise"
        required: true
        default: "2025"
        type: string
      min_interval:
        description: "Minimum interval between requests"
        required: true
        default: "1.05"
        type: string
  workflow_run:
    workflows: ["Gate C RGF02 Smoke"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: gate-c-rgf02-sp645-${{ github.event_name == 'workflow_dispatch' && inputs.year || '2025' }}
  cancel-in-progress: false

jobs:
  acquire-state:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RGF_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.year || '2025' }}
      MIN_INTERVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.min_interval || '1.05' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download pinned SP municipality geometry
        run: |
          mkdir -p build
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/tbrugz/geodata-br/c39dfb040bfd466fe2a476bafed00749c5c42f16/geojson/geojs-35-mun.json" --output build/sp.geojson
      - name: Acquire SP645 RGF Annex 02
        run: |
          python -m pipeline.acquire.siconfi_rgf02_state --geojson build/sp.geojson --year "$RGF_YEAR" --output "build/raw/rgf02/$RGF_YEAR" --long-csv "build/normalized/rgf02_long_$RGF_YEAR.csv" --min-interval "$MIN_INTERVAL"
      - name: Normalize canonical RGF02 variables
        run: |
          python -m pipeline.normalize.rgf02 --long-csv "build/normalized/rgf02_long_$RGF_YEAR.csv" --output-csv "build/normalized/rgf02_canonical_$RGF_YEAR.csv" --manifest "build/normalized/rgf02_canonical_$RGF_YEAR.json"
      - name: Validate state acquisition
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          year=os.environ["RGF_YEAR"]
          raw=json.loads(Path(f"build/raw/rgf02/{year}/manifests/rgf-02-{year}.json").read_text(encoding="utf-8"))
          canon=json.loads(Path(f"build/normalized/rgf02_canonical_{year}.json").read_text(encoding="utf-8"))
          if raw["failed"]:
              raise SystemExit(f"Unresolved failures: {raw['failed'][:20]}")
          if raw["municipalities_requested"] != 645:
              raise SystemExit("Expected 645 municipalities")
          if canon["conflicts"]:
              raise SystemExit(f"Canonical conflicts: {canon['conflicts'][:20]}")
          print("observed_municipalities=" + str(raw["observed_municipalities"]))
          print("long_rows=" + str(raw["long_rows"]))
          print("distinct_account_codes=" + str(raw["distinct_account_codes"]))
          print("canonical_rows=" + str(canon["rows"]))
          for field,count in sorted(canon["coverage"].items()):
              print(f"{field}={count}/645")
          print("long_csv_sha256=" + raw["long_csv_sha256"])
          print("canonical_sha256=" + canon["output_sha256"])
          PY
      - name: Upload state artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-rgf02-sp645-${{ env.RGF_YEAR }}
          path: |
            build/raw/rgf02/${{ env.RGF_YEAR }}
            build/normalized/rgf02_long_${{ env.RGF_YEAR }}.csv
            build/normalized/rgf02_canonical_${{ env.RGF_YEAR }}.csv
            build/normalized/rgf02_canonical_${{ env.RGF_YEAR }}.json
          retention-days: 30
