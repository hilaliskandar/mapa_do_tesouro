name: Gate C RGF02 SP645

on:
  workflow_dispatch:
    inputs:
      year:
        description: "RGF Annex 02 exercise"
        required: true
        default: "2025"
        type: string
      min_interval:
        description: "Minimum interval between requests"
        required: true
        default: "1.05"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/gate-c-rgf02-sp645.yml"

permissions:
  contents: read

concurrency:
  group: gate-c-rgf02-sp645-${{ github.event_name == 'workflow_dispatch' && inputs.year || '2025' }}
  cancel-in-progress: false

jobs:
  acquire-state:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RGF02_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.year || '2025' }}
      MIN_INTERVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.min_interval || '1.05' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned SP municipality geometry
        run: |
          mkdir -p build
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/tbrugz/geodata-br/c39dfb040bfd466fe2a476bafed00749c5c42f16/geojson/geojs-35-mun.json" --output build/sp.geojson

      - name: Acquire SP645 RGF Annex 02
        run: |
          python -m pipeline.acquire.siconfi_rgf02_state \
            --geojson build/sp.geojson \
            --year "$RGF02_YEAR" \
            --output "build/raw/rgf02/$RGF02_YEAR" \
            --long-csv "build/normalized/rgf02_long_$RGF02_YEAR.csv" \
            --min-interval "$MIN_INTERVAL"

      - name: Normalize full SP645 universe
        run: |
          python -m pipeline.normalize.rgf02 \
            --long-csv "build/normalized/rgf02_long_$RGF02_YEAR.csv" \
            --output-csv "build/normalized/rgf02_$RGF02_YEAR.csv" \
            --manifest "build/normalized/rgf02_$RGF02_YEAR_manifest.json" \
            --universe-geojson build/sp.geojson \
            --year "$RGF02_YEAR"

      - name: Validate state acquisition
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          year = os.environ["RGF02_YEAR"]
          acquisition = json.loads(
              Path(f"build/raw/rgf02/{year}/manifests/rgf-02-{year}.json")
              .read_text(encoding="utf-8")
          )
          normalized = json.loads(
              Path(f"build/normalized/rgf02_{year}_manifest.json")
              .read_text(encoding="utf-8")
          )

          if acquisition["failed"]:
              raise SystemExit(f"Unresolved failures: {acquisition['failed'][:20]}")
          if acquisition["municipalities_requested"] != 645:
              raise SystemExit("Expected 645 requested municipalities")
          if normalized["rows"] != 645:
              raise SystemExit(f"Expected 645 normalized rows, got {normalized['rows']}")
          if normalized["conflicts"]:
              raise SystemExit(f"Normalization conflicts: {normalized['conflicts']}")

          print("Gate C RGF02 SP645: OK")
          print("observed_municipalities=" + str(acquisition["observed_municipalities"]))
          print("long_rows=" + str(acquisition["long_rows"]))
          print("distinct_account_codes=" + str(acquisition["distinct_account_codes"]))
          for field, count in sorted(normalized["coverage"].items()):
              print(f"{field}={count}/645")
          print("normalized_sha256=" + normalized["output_sha256"])
          print("long_csv_sha256=" + acquisition["long_csv_sha256"])
          print("raw_tree_sha256=" + acquisition["raw_tree_sha256"])
          PY

      - name: Publish summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          year = os.environ["RGF02_YEAR"]
          acquisition = json.loads(
              Path(f"build/raw/rgf02/{year}/manifests/rgf-02-{year}.json")
              .read_text(encoding="utf-8")
          )
          normalized = json.loads(
              Path(f"build/normalized/rgf02_{year}_manifest.json")
              .read_text(encoding="utf-8")
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("### Gate C RGF02 SP645\n\n")
              out.write(f"- year: {year}\n")
              out.write(f"- requested: {acquisition['municipalities_requested']}\n")
              out.write(f"- observed municipalities: {acquisition['observed_municipalities']}\n")
              out.write(f"- long rows: {acquisition['long_rows']}\n")
              out.write(f"- distinct account codes: {acquisition['distinct_account_codes']}\n")
              out.write(f"- normalized rows: {normalized['rows']}\n")
              out.write(f"- normalized SHA-256: {normalized['output_sha256']}\n")
              for field, count in sorted(normalized["coverage"].items()):
                  out.write(f"- {field}: {count}/645\n")
          PY

      - name: Upload state artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-rgf02-sp645-${{ env.RGF02_YEAR }}
          path: |
            build/raw/rgf02/${{ env.RGF02_YEAR }}
            build/normalized/rgf02_long_${{ env.RGF02_YEAR }}.csv
            build/normalized/rgf02_${{ env.RGF02_YEAR }}.csv
            build/normalized/rgf02_${{ env.RGF02_YEAR }}_manifest.json
          retention-days: 30
