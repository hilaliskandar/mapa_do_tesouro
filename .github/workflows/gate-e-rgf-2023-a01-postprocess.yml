name: Gate E Corrected Historical RGF Postprocess

on:
  workflow_run:
    workflows: ["Gate E Corrected RGF A01 2023"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  patch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      ORIGINAL_HISTORY_RUN_ID: "37746201460"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download corrected A01 artifact
        uses: actions/download-artifact@v4
        with:
          name: gate-e-rgf-a01-2023-combined
          path: build/a01
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download original Gate E history artifact
        uses: actions/download-artifact@v4
        with:
          name: gate-e-rgf-history-2023-2024-combined
          path: build/original
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37746201460

      - name: Patch corrected A01 into existing history
        run: |
          python -m pipeline.qa.rgf_history_patch_a01 \
            --history-csv build/original/rgf_history_2023_2024.csv \
            --a01-csv build/a01/rgf_a01_2023.csv \
            --output-csv build/corrected/rgf_history_2023_2024_corrected.csv \
            --summary build/corrected/rgf_history_2023_2024_corrected_summary.json

      - name: Write QA
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              Path("build/corrected/rgf_history_2023_2024_corrected_summary.json")
              .read_text(encoding="utf-8")
          )
          lines = [
              "# QA — Gate E RGF histórico corrigido — 2023–2024",
              "",
              f"Run fonte A01 corrigido: `{os.environ['SOURCE_RUN_ID']}`.",
              f"Run histórico original: `{os.environ['ORIGINAL_HISTORY_RUN_ID']}`.",
              "",
              f"- linhas: {summary['rows']};",
              f"- linhas 2023 corrigidas: {summary['patched_2023_rows']};",
              f"- SHA-256: `{summary['sha256']}`.",
              "",
              "## Cobertura por ano",
              "",
              "| Ano | Variável | Observados | Ausentes | Cobertura |",
              "|---:|---|---:|---:|---:|",
          ]
          for year in ("2023", "2024"):
              for field, observed in sorted(summary["coverage"][year].items()):
                  missing = 645 - int(observed)
                  pct = 100.0 * int(observed) / 645
                  lines.append(
                      f"| {year} | `{field}` | {observed} | {missing} | {pct:.2f}% |"
                  )
          lines.extend(
              [
                  "",
                  "A correção altera somente os três campos do RGF Anexo 01 em 2023.",
                  "O Anexo 02 de 2023 e todos os campos de 2024 são preservados do artifact original.",
                  "",
              ]
          )
          out = Path(
              "governance/auto/"
              f"QA_GATE_E_RGF_HISTORY_CORRECTED_RUN_{os.environ['SOURCE_RUN_ID']}.md"
          )
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Upload corrected history
        uses: actions/upload-artifact@v4
        with:
          name: gate-e-rgf-history-2023-2024-corrected
          path: |
            build/corrected/rgf_history_2023_2024_corrected.csv
            build/corrected/rgf_history_2023_2024_corrected_summary.json
          retention-days: 30

      - name: Commit safe QA update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/auto/
          git commit -m "gate-e: record corrected historical RGF QA"
          git push origin HEAD:main
