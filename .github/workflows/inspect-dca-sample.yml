name: Inspect DCA sample

on:
  push:
    branches:
      - dca-normalization-v1

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official sample annexes
        shell: bash
        run: |
          python - <<'PY'
          from pipeline.sources.siconfi import SiconfiClient
          client=SiconfiClient(min_interval=1.05)
          for annex in ("DCA-Anexo I-C","DCA-Anexo I-D","DCA-Anexo I-E"):
              result=client.fetch_dca(year=2025, entity_id="3501608", annex=annex)
              print("ANNEX",annex,"ITEMS",len(result.items))
              cols=sorted({str(x.get("coluna")) for x in result.items})
              print("COLUMNS",cols)
              for item in result.items:
                  conta=str(item.get("conta") or "").lower()
                  rotulo=str(item.get("rotulo") or "").lower()
                  if any(k in conta or k in rotulo for k in (
                      "receitas correntes","tribut","iptu","itbi","servi","fpm",
                      "icms","ipva","investimentos","despesas correntes",
                      "pessoal","juros","invers","amortiza","urbanismo",
                      "habita","saneamento","ambiental","transporte","saude","educa"
                  )):
                      print("ITEM", {k:item.get(k) for k in ("anexo","rotulo","coluna","cod_conta","conta","valor","populacao")})
          PY
