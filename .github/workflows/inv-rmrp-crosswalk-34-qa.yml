name: INV RMRP - QA crosswalk 34 municipios
on:
  pull_request:
    paths:
      - "pipeline/qa/qa_inv_rmrp_crosswalk_cobertura_34.py"
      - "governance/INV_RMRP_SIAFEM_CROSSWALK_COBERTURA_34_MUNICIPIOS_2026_11_12.json"
      - "governance/INV_RMRP_SERRANA_CROSSWALK_100540_101375_SIAFEM_510101_2026_11_12.json"
      - "governance/INV_RMRP_PRADOPOLIS_100556_2024_SIAFEM_DIVERGENCIA_2026_11_12.json"
      - ".github/workflows/inv-rmrp-crosswalk-34-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar sintaxe
        run: python -m py_compile pipeline/qa/qa_inv_rmrp_crosswalk_cobertura_34.py
      - name: QA territorial e financeiro dos candidatos sem homologar por igualdade de valor
        run: |
          python pipeline/qa/qa_inv_rmrp_crosswalk_cobertura_34.py \
            --output build/inv-rmrp-crosswalk/QA_CROSSWALK_COBERTURA_34.json
      - name: Preservar somente relatorio derivado QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inv-rmrp-crosswalk-cobertura-34-${{ github.run_id }}
          path: build/inv-rmrp-crosswalk/QA_CROSSWALK_COBERTURA_34.json
          if-no-files-found: warn
          retention-days: 14
