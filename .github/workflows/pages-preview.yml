name: Pages Preview

on:
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        default: "main"
      alias:
        description: "Preview branch alias"
        required: false
        default: "preview"

permissions:
  contents: read

concurrency:
  group: pages-preview-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: true

jobs:
  build-deploy-qa:
    if: ${{ github.event_name != 'release' || !contains(github.event.release.body, 'release_universe: SP_645') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

    steps:
      - name: Resolve ref and preview alias
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ALIAS: ${{ inputs.alias }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "ref=$PR_SHA" >> "$GITHUB_OUTPUT"
            echo "alias=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "release" ]; then
            echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "alias=preview" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${INPUT_REF:-main}" >> "$GITHUB_OUTPUT"
            echo "alias=${INPUT_ALIAS:-preview}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Resolve checked-out commit
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Cloudflare configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "Missing CLOUDFLARE_PAGES_PROJECT"; exit 1; }

      - name: Install validation dependencies
        run: |
          pip install -e . --no-deps
          pip install openpyxl pyyaml pytest

      - name: Run tests
        run: pytest -q tests

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Materialize candidate from published data snapshot
        shell: bash
        run: |
          python deployment/materialize_preview.py \
            --url "https://preview.$CLOUDFLARE_PAGES_PROJECT.pages.dev" \
            --output build/site \
            --app-version "${{ steps.version.outputs.value }}"

      - name: Validate candidate locally
        run: |
          python deployment/qa_pages.py \
            --site build/site \
            --expected-app-version "${{ steps.version.outputs.value }}"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-candidate-${{ steps.target.outputs.alias }}
          path: build/site
          if-no-files-found: error
          retention-days: 14

      - name: Deploy preview
        id: deploy
        shell: bash
        env:
          DEPLOY_ALIAS: ${{ steps.target.outputs.alias }}
        run: |
          npx --yes wrangler@4.148.0 pages deploy build/site \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$DEPLOY_ALIAS" \
            --commit-hash="${{ steps.commit.outputs.sha }}" \
            --commit-message="Automated preview: $GITHUB_WORKFLOW / $GITHUB_RUN_ID" \
            --commit-dirty=false

      - name: Validate deployed preview
        shell: bash
        env:
          DEPLOY_ALIAS: ${{ steps.target.outputs.alias }}
        run: |
          python deployment/qa_pages.py \
            --url "https://$DEPLOY_ALIAS.$CLOUDFLARE_PAGES_PROJECT.pages.dev" \
            --expected-app-version "${{ steps.version.outputs.value }}"

      - name: Publish preview URL
        shell: bash
        env:
          DEPLOY_ALIAS: ${{ steps.target.outputs.alias }}
        run: |
          echo "### Cloudflare Pages preview" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$DEPLOY_ALIAS.$CLOUDFLARE_PAGES_PROJECT.pages.dev" >> "$GITHUB_STEP_SUMMARY"
