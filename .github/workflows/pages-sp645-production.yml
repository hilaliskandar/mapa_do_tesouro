name: SP645 Pages Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Statewide release tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sp645-pages-production
  cancel-in-progress: false

jobs:
  build-deploy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico

    steps:
      - name: Validate statewide release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          BODY="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          printf '%s\n' "$BODY" | grep -F "release_universe: SP_645" >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Resolve checked-out commit
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check private build and Pages configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "Missing CLOUDFLARE_PAGES_PROJECT"; exit 1; }
          test -n "$CLOUDFLARE_R2_BUCKET" || { echo "Missing CLOUDFLARE_R2_BUCKET"; exit 1; }

      - name: Install dependencies
        run: |
          pip install -e . --no-deps
          pip install openpyxl pyyaml pytest

      - name: Run tests
        run: pytest -q tests

      - name: Verify release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          test "$(tr -d '[:space:]' < VERSION)" = "$VERSION"

      - name: Download and verify canonical SP645 inputs from private R2
        run: |
          mkdir -p inputs build
          python deployment/download_r2_source.py \
            --object-key "sp_645/site_inputs/SP645_TYPOLOGY_INPUT_2021_2025.xlsx" \
            --output inputs/SP645_TYPOLOGY_INPUT_2021_2025.xlsx \
            --expected-sha256 72e6302e5331ba05f066eebe55df914a7fc2dd7b6d2114e6df374bfc606977ce
          python deployment/download_r2_source.py \
            --object-key "sp_645/site_inputs/FINBRA_SP645_BASE_MULTIFONTES_2025_GATE_C.xlsx" \
            --output inputs/FINBRA_SP645_BASE_MULTIFONTES_2025_GATE_C.xlsx \
            --expected-sha256 ffd626cfde3fa1c79d7a552d5b3a8ad2e3509dce5efcc9c62c39eb76c3796566
          python deployment/download_r2_source.py \
            --object-key "sp_645/site_inputs/FINBRA_SP645_INDICADORES_2025_GATE_D.xlsx" \
            --output inputs/FINBRA_SP645_INDICADORES_2025_GATE_D.xlsx \
            --expected-sha256 adb9b5b6abbd3f439f3b39cc356522d21430de74117de4bf9ca1589c40e9c161

      - name: Download pinned SP cartography
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen

          url = "https://raw.githubusercontent.com/tbrugz/geodata-br/c39dfb040bfd466fe2a476bafed00749c5c42f16/geojson/geojs-35-mun.json"
          target = Path("inputs/geojs-35-mun.json")
          with urlopen(url, timeout=120) as response:
              data = response.read()
          if len(data) < 1000000:
              raise SystemExit(f"Cartography download too small: {len(data)}")
          target.write_bytes(data)
          print(f"cartography_bytes={len(data)}")
          PY

      - name: Prepare combined SP645 input
        run: |
          python -m pipeline.build.sp645_private_input \
            --typology-input inputs/SP645_TYPOLOGY_INPUT_2021_2025.xlsx \
            --multisource-2025 inputs/FINBRA_SP645_BASE_MULTIFONTES_2025_GATE_C.xlsx \
            --base-mapping data/mappings/base_multifuentes_sp645_2025.yml \
            --output-workbook build/SP645_PRODUCTION_INPUT_2021_2025.xlsx \
            --output-mapping build/SP645_PRODUCTION_MAPPING.yml \
            --manifest build/SP645_PRODUCTION_INPUT_MANIFEST.json

      - name: Build SP645 production candidate
        run: |
          python -m pipeline.build.build_sp645_private_site \
            --workbook build/SP645_PRODUCTION_INPUT_2021_2025.xlsx \
            --mapping build/SP645_PRODUCTION_MAPPING.yml \
            --database build/sp645_production.sqlite \
            --site-output build/site-sp645 \
            --geojson inputs/geojs-35-mun.json

      - name: Validate SP645 production candidate locally
        run: python deployment/qa_sp645_pages.py --site build/site-sp645

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: sp645-pages-production-${{ inputs.release_tag }}
          path: build/site-sp645
          if-no-files-found: error
          retention-days: 30

      - name: Deploy SP645 production
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          npx --yes wrangler@4.148.0 pages deploy build/site-sp645 \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch=main \
            --commit-hash="${{ steps.commit.outputs.sha }}" \
            --commit-message="SP645 production deploy $RELEASE_TAG" \
            --commit-dirty=false

      - name: Validate SP645 production remotely
        run: |
          python deployment/qa_sp645_pages.py \
            --url "https://$CLOUDFLARE_PAGES_PROJECT.pages.dev"

      - name: Publish production URL
        run: |
          echo "### SP645 production" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$CLOUDFLARE_PAGES_PROJECT.pages.dev" >> "$GITHUB_STEP_SUMMARY"
