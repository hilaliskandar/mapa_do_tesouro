name: Release from VERSION

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - governance/RELEASE_*.md
      - data/catalogs/release_*.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          SAFE_VERSION="${VERSION//./_}"
          NOTES="governance/RELEASE_NOTES_V${SAFE_VERSION^^}.md"
          BASELINE="governance/RELEASE_BASELINE_V${SAFE_VERSION^^}.md"
          MANIFEST="data/catalogs/release_v${SAFE_VERSION}.yml"

          if [ -f "$NOTES" ]; then
            RELEASE_NOTES="$NOTES"
          elif [ -f "$BASELINE" ]; then
            RELEASE_NOTES="$BASELINE"
          else
            echo "No release notes found for $VERSION" >&2
            exit 1
          fi

          test -f "$MANIFEST"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$RELEASE_NOTES" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Create release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ steps.version.outputs.notes }}
          MANIFEST: ${{ steps.version.outputs.manifest }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Finanças Municipais SP $TAG" \
            --notes-file "$NOTES"

          gh release upload "$TAG" \
            VERSION \
            "$MANIFEST" \
            "$NOTES"
