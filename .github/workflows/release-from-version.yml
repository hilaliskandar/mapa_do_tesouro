name: Release from VERSION

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - governance/RELEASE_BASELINE_V0_1_0.md
      - data/catalogs/release_v0_1_0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Finanças Municipais SP $TAG" \
            --notes-file governance/RELEASE_BASELINE_V0_1_0.md

          gh release upload "$TAG" \
            VERSION \
            data/catalogs/release_v0_1_0.yml \
            governance/RELEASE_BASELINE_V0_1_0.md
