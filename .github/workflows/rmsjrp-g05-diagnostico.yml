name: RMSJRP G05 - diagnostico territorial reprodutivel
on:
  push:
    branches: [analysis/rmsjrp-g05-diagnostico-2026-11-09]
    paths:
      - editorial/rmsjrp/build_diagnostico_g05.py
      - .github/workflows/rmsjrp-g05-diagnostico.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild G05 and verify municipality/region/parity invariants
        run: python3 editorial/rmsjrp/build_diagnostico_g05.py
      - name: Persist read-only derived outputs into private R2, with SHA256 readback
        run: |
          set -euo pipefail
          PREFIX="rmsjrp/g05/2026_11_09"
          for F in G05_TERRITORIOS_2023_2025.csv G05_VARIACOES_TERRITORIAIS.csv G05_CONTRIBUICOES_MUNICIPAIS.csv G05_POLO_DEMAIS.csv G05_DIRECAO_INVESTIMENTOS.csv QA_G05.json; do
            SRC="build/rmsjrp-g05/$F"
            SHA="$(sha256sum "$SRC" | cut -d ' ' -f 1)"
            MIME="text/csv"
            if [ "$F" = QA_G05.json ]; then MIME="application/json"; fi
            python3 deployment/upload_r2_source.py --source "$SRC" --object-key "$PREFIX/$F" --expected-sha256 "$SHA" --content-type "$MIME"
            python3 deployment/download_r2_source.py --object-key "$PREFIX/$F" --output "build/rmsjrp-g05/readback-$F" --expected-sha256 "$SHA"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rmsjrp-g05-territorial-qa
          path: |
            build/rmsjrp-g05/G05_*.csv
            build/rmsjrp-g05/QA_G05.json
          retention-days: 30
          if-no-files-found: warn
