name: RMSJRP G05-C - mapas IBGE 2022 EPSG 4674
on:
  push:
    branches: [analysis/rmsjrp-g05-diagnostico-2026-11-09]
    paths:
      - editorial/rmsjrp/gerar_mapas_g05c.py
      - .github/workflows/rmsjrp-g05c-cartografia.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mapas:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry QA and plotting dependencies
        run: python3 -m pip install --disable-pip-version-check pyshp shapely pyproj matplotlib
      - name: Recover official IBGE shapefile; do not simplify polygons
        run: |
          set -euo pipefail
          mkdir -p build/rmsjrp-g05c
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            "https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2022/UFs/SP/SP_Municipios_2022.zip" \
            -o build/rmsjrp-g05c/SP_Municipios_2022.zip
      - name: Read proven G05 data from private R2
        run: |
          python3 deployment/download_r2_source.py --object-key rmsjrp/g05/2026_11_09/G05_CONTRIBUICOES_MUNICIPAIS.csv --expected-sha256 670ca3079eabb9a8d6218d104b8762ee8e8de7239ba6d1f0bc9273e80f87136c --output build/rmsjrp-g05c/G05_CONTRIBUICOES_MUNICIPAIS.csv
          python3 deployment/download_r2_source.py --object-key rmsjrp/g04/2026_11_09/SERIES_MUNICIPAIS_2013_2025.csv --expected-sha256 1f0413304c54edbe57fe129a506d088da2cd296d767f901992c02f803fbd62e5 --output build/rmsjrp-g05c/SERIES_MUNICIPAIS_2013_2025.csv
      - name: Audit CRS, 37 geometries and render two choropleths
        run: python3 editorial/rmsjrp/gerar_mapas_g05c.py
      - name: Persist official input and derived maps in private R2 with SHA readback
        run: |
          set -euo pipefail
          PREFIX="rmsjrp/g05/2026_11_09/cartografia"
          for F in SP_Municipios_2022.zip RMSJRP_37_IBGE2022_EPSG4674.geojson MAPA_G05_VAR_INVEST_2024_2025.png MAPA_G05_INVESTIMENTO_PC_2025.png QA_G05C_CARTOGRAFIA.json; do
            SRC="build/rmsjrp-g05c/$F"
            SHA="$(sha256sum "$SRC" | cut -d ' ' -f 1)"
            MIME="application/octet-stream"
            case "$F" in *.png) MIME=image/png;; *.json|*.geojson) MIME=application/json;; *.zip) MIME=application/zip;; esac
            python3 deployment/upload_r2_source.py --source "$SRC" --object-key "$PREFIX/$F" --expected-sha256 "$SHA" --content-type "$MIME"
            python3 deployment/download_r2_source.py --object-key "$PREFIX/$F" --output "build/rmsjrp-g05c/readback-$F" --expected-sha256 "$SHA"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rmsjrp-g05c-mapas-ibge2022
          path: |
            build/rmsjrp-g05c/MAPA_G05_*.png
            build/rmsjrp-g05c/RMSJRP_37_IBGE2022_EPSG4674.geojson
            build/rmsjrp-g05c/QA_G05C_CARTOGRAFIA.json
          retention-days: 30
          if-no-files-found: warn
