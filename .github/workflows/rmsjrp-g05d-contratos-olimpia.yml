name: RMSJRP G05-D - inventario de contratos Olimpia
on:
  push:
    branches: [audit/rmsjrp-g05d-contratos-olimpia-2026-11-09]
    paths:
      - editorial/rmsjrp/auditar_contratos_olimpia_g05d.py
      - .github/workflows/rmsjrp-g05d-contratos-olimpia.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventariar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture contract register and QA
        run: python3 editorial/rmsjrp/auditar_contratos_olimpia_g05d.py
      - name: Preserve evidence on R2 private with SHA readback
        run: |
          set -euo pipefail
          PREFIX="rmsjrp/g05d/2026_11_09/olimpia_contratos"
          for F in CONTRATOS_OLIMPIA_OFICIAL_RAW.json CONTRATOS_OLIMPIA_INVENTARIO.csv QA_G05D_CONTRATOS_OLIMPIA.json; do
            SRC="build/rmsjrp-g05d-contratos/$F"
            SHA="$(sha256sum "$SRC" | cut -d ' ' -f 1)"
            MIME="text/csv"; case "$F" in *.json) MIME="application/json";; esac
            python3 deployment/upload_r2_source.py --source "$SRC" --object-key "$PREFIX/$F" --expected-sha256 "$SHA" --content-type "$MIME"
            python3 deployment/download_r2_source.py --object-key "$PREFIX/$F" --output "build/rmsjrp-g05d-contratos/readback-$F" --expected-sha256 "$SHA"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rmsjrp-g05d-contratos-olimpia
          path: |
            build/rmsjrp-g05d-contratos/CONTRATOS_OLIMPIA_INVENTARIO.csv
            build/rmsjrp-g05d-contratos/QA_G05D_CONTRATOS_OLIMPIA.json
          retention-days: 30
          if-no-files-found: warn
