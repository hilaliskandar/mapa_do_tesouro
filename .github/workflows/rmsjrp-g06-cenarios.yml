name: RMSJRP G06 - cenarios condicionais 2027-2030
on:
  push:
    branches: [analysis/rmsjrp-g06-cenarios-2026-11-09]
    paths:
      - editorial/rmsjrp/build_cenarios_g06.py
      - editorial/rmsjrp/PARAMETROS_G06_2027_2030.json
      - .github/workflows/rmsjrp-g06-cenarios.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild three conditional scenarios from verified G04 R2 data
        run: python3 editorial/rmsjrp/build_cenarios_g06.py
      - name: Persist scenario evidence privately and verify SHA-256 readback
        run: |
          set -euo pipefail
          PREFIX="rmsjrp/g06/2026_11_09/cenarios_v1"
          for F in G06_SIMULACOES_444_MUNICIPIOS.csv G06_SIMULACOES_60_TERRITORIOS.csv QA_G06.json; do
            SRC="build/rmsjrp-g06/$F"
            SHA="$(sha256sum "$SRC" | cut -d ' ' -f 1)"
            MIME="text/csv"
            if [ "$F" = QA_G06.json ]; then MIME="application/json"; fi
            python3 deployment/upload_r2_source.py --source "$SRC" --object-key "$PREFIX/$F" --expected-sha256 "$SHA" --content-type "$MIME"
            python3 deployment/download_r2_source.py --object-key "$PREFIX/$F" --output "build/rmsjrp-g06/readback-$F" --expected-sha256 "$SHA"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rmsjrp-g06-cenarios-qa
          path: |
            build/rmsjrp-g06/G06_SIMULACOES_*.csv
            build/rmsjrp-g06/QA_G06.json
          retention-days: 30
          if-no-files-found: warn
