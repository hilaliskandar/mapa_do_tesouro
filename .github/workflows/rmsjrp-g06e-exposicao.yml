name: RMSJRP G06-E - matriz de exposicao fiscal 37 municipios
on:
  push:
    branches: [analysis/rmsjrp-g06-exposicao-2026-11-09]
    paths:
      - editorial/rmsjrp/build_exposicao_g06e.py
      - .github/workflows/rmsjrp-g06e-exposicao.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exposicao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exposure matrix from canonical G04, distinguish unknown from zero
        run: python3 editorial/rmsjrp/build_exposicao_g06e.py
      - name: Preserve exposure matrix on R2 private and verify readback SHA
        run: |
          set -euo pipefail
          PREFIX="rmsjrp/g06/2026_11_09/exposicao_v1"
          for F in G06E_MATRIZ_EXPOSICAO_37x12.csv G06E_RESUMO_TERRITORIAL_5x12.csv QA_G06E.json; do
            SRC="build/rmsjrp-g06e/$F"
            SHA="$(sha256sum "$SRC" | cut -d ' ' -f 1)"
            MIME="text/csv"
            if [ "$F" = QA_G06E.json ]; then MIME="application/json"; fi
            python3 deployment/upload_r2_source.py --source "$SRC" --object-key "$PREFIX/$F" --expected-sha256 "$SHA" --content-type "$MIME"
            python3 deployment/download_r2_source.py --object-key "$PREFIX/$F" --output "build/rmsjrp-g06e/readback-$F" --expected-sha256 "$SHA"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rmsjrp-g06e-exposicao-qa
          path: |
            build/rmsjrp-g06e/G06E_*.csv
            build/rmsjrp-g06e/QA_G06E.json
          retention-days: 30
          if-no-files-found: warn
