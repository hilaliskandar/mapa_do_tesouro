name: RMSJRP G06-F2 - enumerar propostas paginadas
on:
  push:
    branches: [analysis/rmsjrp-g06f2-paginacao-2026-11-09]
    paths:
      - editorial/rmsjrp/enumerar_propostas_g06f2.py
      - .github/workflows/rmsjrp-g06f2-enumeracao.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enumerar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Paginate official Transferegov proposal endpoints and QA totals
        run: python3 editorial/rmsjrp/enumerar_propostas_g06f2.py
      - name: Persist full curated results and QA with SHA readback
        run: |
          set -euo pipefail
          PREFIX="rmsjrp/g06/2026_11_09/instrumentos_api_f2"
          for F in build/rmsjrp-g06f2-full/*.csv build/rmsjrp-g06f2-full/QA_G06F2.json; do
            test -f "$F" || continue
            SHA="$(sha256sum "$F" | cut -d ' ' -f 1)"
            NAME="$(basename "$F")"
            MIME="text/csv"; case "$F" in *.json) MIME=application/json;; esac
            python3 deployment/upload_r2_source.py --source "$F" --object-key "$PREFIX/$NAME" --expected-sha256 "$SHA" --content-type "$MIME"
            python3 deployment/download_r2_source.py --object-key "$PREFIX/$NAME" --output "build/rmsjrp-g06f2-full/readback-$NAME" --expected-sha256 "$SHA"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rmsjrp-g06f2-paginacao-dedup
          path: |
            build/rmsjrp-g06f2-full/*.csv
            build/rmsjrp-g06f2-full/QA_G06F2.json
          retention-days: 30
          if-no-files-found: warn
