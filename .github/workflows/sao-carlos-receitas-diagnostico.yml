name: Sao Carlos TCESP receitas 2023-2026 diagnostico
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sao-carlos-receitas-diagnostico.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receitas:
    runs-on: [self-hosted, Linux, X64, financas-tcesp-wsl2]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Extrair esquema e cobertura das receitas TCESP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/sao-carlos-receitas
          for ano in 2023 2024 2025 2026; do
            python3 editorial/sao_carlos/receitas_diagnostico.py "$ano" > "build/sao-carlos-receitas/sao-carlos_${ano}.json"
            python3 - "$ano" <<'PY'
          import json,sys,pathlib
          y=int(sys.argv[1]);d=json.loads(pathlib.Path(f"build/sao-carlos-receitas/sao-carlos_{y}.json").read_text())
          assert d["linhas"]>0 and d["colunas"]
          print(y,d["linhas"],d["colunas"],d["campos_com_codigos_tributarios"])
          PY
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sao-carlos-receitas-tcesp-esquema-2023-2026
          path: build/sao-carlos-receitas/*.json
          retention-days: 30
