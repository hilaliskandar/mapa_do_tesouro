name: SP645 - auditar ZIP oficial de convenios (sem publicacao)

on:
  workflow_dispatch:
  push:
    branches:
      - investimentos-territoriais-sp645-20261111
    paths:
      - .github/workflows/sp645-convenios-auditoria.yml
      - pipeline/coleta/collect_sp_convenios_oficial.py

permissions:
  contents: read

jobs:
  auditar-convenios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adquirir ZIP oficial e verificar integridade
        run: |
          python pipeline/coleta/collect_sp_convenios_oficial.py --download --outdir "$RUNNER_TEMP/sp_convenios"
      - name: Inspecionar campos e cobertura temporal sem divulgar linhas individuais
        run: |
          python - <<'PY'
          import csv, glob, io, os, re, zipfile
          from collections import Counter
          names=glob.glob(os.path.join(os.environ['RUNNER_TEMP'],'sp_convenios','*.zip'))
          for name in names:
              with zipfile.ZipFile(name) as z:
                  for member in z.namelist():
                      if not member.lower().endswith(('.csv','.txt')):
                          continue
                      raw=z.read(member)
                      candidates=['utf-8-sig','utf-8','cp1252','latin-1']
                      text=None
                      for enc in candidates:
                          try:
                              text=raw.decode(enc)
                              break
                          except UnicodeDecodeError: pass
                      if text is None: raise RuntimeError('encoding nao identificado')
                      sample=text[:16000]
                      try: delimiter=csv.Sniffer().sniff(sample,delimiters=';,|\\t').delimiter
                      except csv.Error: delimiter=';'
                      rows=csv.DictReader(io.StringIO(text),delimiter=delimiter)
                      cols=rows.fieldnames or []
                      total=0
                      dates=Counter()
                      for row in rows:
                          total+=1
                          for key,value in row.items():
                              if not key or value is None:continue
                              if re.search(r'ano|celebra|data',key,re.IGNORECASE):
                                  m=re.search(r'\\b(?:19|20)\\d{2}\\b',str(value))
                                  if m: dates[(key,m.group(0))]+=1
                      print('CSV_MEMBER:',member)
                      print('CSV_ENCODING:',enc,'CSV_DELIMITER:',repr(delimiter))
                      print('CSV_FIELDS:',repr(cols))
                      print('CSV_ROWS:',total)
                      print('CSV_DATE_HITS:',dates.most_common(30))
          PY
      - name: Publicar apenas metadados nao sensiveis no log
        if: always()
        run: |
          python - <<'PY'
          import glob,json,os
          paths=glob.glob(os.path.join(os.environ['RUNNER_TEMP'],'sp_convenios','*.manifest.json'))
          if not paths:
              print('SEM_MANIFESTO: a aquisição não produziu arquivo verificável')
              raise SystemExit(0)
          for p in paths:
              v=json.load(open(p,encoding='utf8'))
              print('FONTE:',v.get('fonte_id'))
              print('HTTP:',v.get('http_status'))
              print('BYTES:',v.get('bytes'))
              print('SHA256:',v.get('sha256'))
              print('QA:',v.get('qa_status'))
              print('MEMBROS_ZIP:',len(v.get('zip_members',[])))
              print('ERROS:',v.get('errors',[]))
          PY
      # Não publicar o ZIP nem os microdados como artefato de um repositório.
      # A persistência canônica privada no R2 requer workflow separado e homologação.
