name: SP645 DCA historical private integration QA

on:
  workflow_dispatch:
  push:
    branches: [investimentos-territoriais-sp645-20261111]
    paths: ['.github/workflows/sp645-dca-history-private.yml']
permissions:
  contents: read

concurrency:
  group: sp645-dca-history-private
  cancel-in-progress: false

jobs:
  build-deploy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check private build and Pages configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "Missing CLOUDFLARE_PAGES_PROJECT"; exit 1; }
          test -n "$CLOUDFLARE_R2_BUCKET" || { echo "Missing CLOUDFLARE_R2_BUCKET"; exit 1; }

      - name: Install dependencies
        run: |
          pip install -e . --no-deps
          pip install openpyxl pyyaml pytest

      - name: Run tests
        run: pytest -q tests

      - name: Download and verify canonical SP645 inputs from private R2
        run: |
          mkdir -p inputs build
          python deployment/download_r2_source.py \
            --object-key "sp_645/site_inputs/SP645_TYPOLOGY_INPUT_2021_2025.xlsx" \
            --output inputs/SP645_TYPOLOGY_INPUT_2021_2025.xlsx \
            --expected-sha256 72e6302e5331ba05f066eebe55df914a7fc2dd7b6d2114e6df374bfc606977ce
          python deployment/download_r2_source.py \
            --object-key "sp_645/site_inputs/FINBRA_SP645_BASE_MULTIFONTES_2025_GATE_C.xlsx" \
            --output inputs/FINBRA_SP645_BASE_MULTIFONTES_2025_GATE_C.xlsx \
            --expected-sha256 ffd626cfde3fa1c79d7a552d5b3a8ad2e3509dce5efcc9c62c39eb76c3796566
          python deployment/download_r2_source.py \
            --object-key "sp_645/site_inputs/FINBRA_SP645_INDICADORES_2025_GATE_D.xlsx" \
            --output inputs/FINBRA_SP645_INDICADORES_2025_GATE_D.xlsx \
            --expected-sha256 adb9b5b6abbd3f439f3b39cc356522d21430de74117de4bf9ca1589c40e9c161

      - name: Download pinned SP cartography
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen

          url = "https://raw.githubusercontent.com/tbrugz/geodata-br/c39dfb040bfd466fe2a476bafed00749c5c42f16/geojson/geojs-35-mun.json"
          target = Path("inputs/geojs-35-mun.json")
          with urlopen(url, timeout=120) as response:
              data = response.read()
          if len(data) < 1000000:
              raise SystemExit(f"Cartography download too small: {len(data)}")
          target.write_bytes(data)
          print(f"cartography_bytes={len(data)}")
          PY

      - name: Prepare combined SP645 input
        run: |
          python -m pipeline.build.sp645_private_input \
            --typology-input inputs/SP645_TYPOLOGY_INPUT_2021_2025.xlsx \
            --multisource-2025 inputs/FINBRA_SP645_BASE_MULTIFONTES_2025_GATE_C.xlsx \
            --base-mapping data/mappings/base_multifuentes_sp645_2025.yml \
            --output-workbook build/SP645_PRIVATE_SITE_INPUT_2021_2025.xlsx \
            --output-mapping build/SP645_PRIVATE_SITE_MAPPING.yml \
            --manifest build/SP645_PRIVATE_SITE_INPUT_MANIFEST.json

      - name: Build SP645 candidate
        run: |
          python -m pipeline.build.build_sp645_private_site \
            --workbook build/SP645_PRIVATE_SITE_INPUT_2021_2025.xlsx \
            --mapping build/SP645_PRIVATE_SITE_MAPPING.yml \
            --database build/sp645_candidate.sqlite \
            --site-output build/site-sp645 \
            --geojson inputs/geojs-35-mun.json

      - name: Include only approved RMRP territorial catalog
        run: python deployment/materialize_rmrp_territorial_sp645.py --site build/site-sp645

      - name: Verify regional monetary conservation
        run: python pipeline/qa/audit_ra_rg_conservation.py --database build/sp645_candidate.sqlite --output build/qa_ra_rg_conservation.json

      - name: Validate SP645 candidate locally
        run: python deployment/qa_sp645_pages.py --site build/site-sp645

      - name: Validate complete API v2 artifacts
        run: python deployment/qa_api_v2.py --site build/site-sp645

      - name: Stage canonical DCA historical sidecar (private artifact only)
        run: |
          python deployment/download_r2_source.py --object-key sp_645/dca/2013_2025/normalized.csv --output build/dca_history.csv --expected-sha256 67a94313e0f0557bc23f48c78a1396fd02ae10ad7923ea2ac2e5c9f2726f65d5
          python -m pipeline.build.export_dca_historical_v2 build/dca_history.csv build/dca_history --expected-sha256 67a94313e0f0557bc23f48c78a1396fd02ae10ad7923ea2ac2e5c9f2726f65d5
          mkdir -p build/private_history
          cp build/site-sp645/data/api/v2/manifest.json build/private_history/manifest.json
          python -m pipeline.build.stage_dca_history_v2 build/dca_history build/private_history
          cmp build/site-sp645/data/api/v2/manifest.json build/private_history/manifest.json
      - name: Reconcile current API with historical DCA
        run: python pipeline/qa/audit_dca_history_current.py --history build/dca_history --api build/site-sp645/data/api/v2 --output build/private_history/qa_current_parity.json
      - name: Aggregate historical DCA by territorial universe
        run: python pipeline/qa/aggregate_dca_history_regions.py --history build/dca_history --database build/sp645_candidate.sqlite --output build/private_history/history/dca/regional
      - name: Assemble historical interface for local browser QA only
        run: |
          cp -r build/private_history/history build/site-sp645/data/api/v2/
          cp build/private_history/catalog/historical_sources.json build/site-sp645/data/api/v2/catalog/
          cmp build/site-sp645/data/api/v2/manifest.json build/private_history/manifest.json
          node --check build/site-sp645/app.js
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test historical interface locally
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory build/site-sp645 > build/history-http.log 2>&1 &
          python deployment/qa_dca_history_browser.py
      - name: Rebuild complementary TCESP from permanent R2
        run: python deployment/rebuild_tcesp_r2.py
      - name: Compare TCESP and DCA liquidated investments and rank discrepancies
        run: python pipeline/qa/audit_tcesp_dca_investments.py --history build/dca_history --tcesp build/tcesp_r2/tcesp.sqlite --core build/sp645_candidate.sqlite --output build/private_history/qa_tcesp_dca
      - name: Stage TCESP and validate both historical layers locally
        run: |
          python pipeline/build/export_tcesp_investimentos_api_v2.py --database build/tcesp_r2/tcesp.sqlite --output build/tcesp-preview
          python deployment/stage_tcesp_api_v2.py --preview build/tcesp-preview --site build/site-sp645 --enable-tcesp
          cmp build/site-sp645/data/api/v2/manifest.json build/private_history/manifest.json
          python deployment/qa_api_v2.py --site build/site-sp645
          python deployment/qa_tcesp_http_staging.py --site build/site-sp645 --report build/private_history/qa_tcesp_http.json
          python deployment/qa_tcesp_browser.py --site build/site-sp645 --report build/private_history/qa_tcesp_browser.json
          cp build/tcesp_r2/qa_reconstruction.json build/private_history/qa_tcesp_reconstruction.json
      - name: Archive integrated candidate without deployment
        uses: actions/upload-artifact@v4
        with:
          name: sp645-v060-integrated-candidate
          path: build/site-sp645
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sp645-dca-history-private-qa
          path: build/private_history
          retention-days: 14
