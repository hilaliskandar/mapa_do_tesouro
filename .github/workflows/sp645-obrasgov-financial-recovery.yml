name: SP645 ObrasGov financial recovery first 1000
on:
  push:
    branches: [investimentos-territoriais-sp645-20261111]
    paths: ['.github/workflows/sp645-obrasgov-financial-recovery.yml']
permissions:
  contents: read
concurrency:
  group: sp645-obrasgov-financial
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python deployment/download_r2_source.py --object-key sp_645/federal/obrasgov/financial/inventory/run_45927622363/fea2f05168334f1edc41ae664585389fe6f42156e360e88b569cdedd71da2ef9.tar.gz --expected-sha256 fea2f05168334f1edc41ae664585389fe6f42156e360e88b569cdedd71da2ef9 --output build/inventory.tar.gz
      - name: Recover and verify independent batches
        run: |
          set -euo pipefail
          for offset in 0 100 200 300 400 500 600 700 800 900; do
            dir="build/obras-recovery/$offset"
            python -m pipeline.acquire.sp645_obrasgov_financial_recovery --inventory build/inventory.tar.gz --offset "$offset" --limit 100 --out "$dir"
            tar -czf "$dir.tar.gz" -C "$dir" values.json qa.json
            sha="$(sha256sum "$dir.tar.gz" | cut -d' ' -f1)"
            key="sp_645/federal/obrasgov/financial/recovery/run_${{ github.run_id }}/offset_${offset}_${sha}.tar.gz"
            python deployment/upload_r2_source.py --source "$dir.tar.gz" --object-key "$key" --expected-sha256 "$sha" --content-type application/gzip
            python deployment/download_r2_source.py --object-key "$key" --expected-sha256 "$sha" --output "$dir.readback.tar.gz"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obrasgov-recovery-qa
          path: build/obras-recovery/*/qa.json
