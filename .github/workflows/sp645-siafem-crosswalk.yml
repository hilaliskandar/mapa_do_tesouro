name: SP645 - cruzar codigos IBGE e SIAFEM no portal oficial
on:
  workflow_dispatch:
  push:
    branches: [investimentos-territoriais-sp645-20261111]
    paths:
      - .github/workflows/sp645-siafem-crosswalk.yml
      - pipeline/qa/build_sp645_siafem_crosswalk.py
permissions:
  contents: write
jobs:
  crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Confrontar nomes oficiais e preservar estados sem atribuição fuzzy
        run: |
          python pipeline/qa/build_sp645_siafem_crosswalk.py \
            --roster governance/DIM_SP645_IBGE_RA_RG_RM_AU_CONSOLIDADA_2026_11_14.csv \
            --output governance/controls/investimentos_sp645/crosswalk_ibge_siafem_2026_11_16.csv \
            --qa governance/controls/investimentos_sp645/crosswalk_ibge_siafem_qa_2026_11_16.json
      - name: Persistir apenas dados publicos de mapeamento na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/controls/investimentos_sp645/crosswalk_ibge_siafem_2026_11_16.csv governance/controls/investimentos_sp645/crosswalk_ibge_siafem_qa_2026_11_16.json
          git diff --cached --quiet || (git commit -m "data: registrar crosswalk SIAFEM SP645 com QA explicito" && git push)
