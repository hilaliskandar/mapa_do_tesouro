name: SP645 - QA cardinalidade piloto de parcelas SIAFEM
on:
  workflow_dispatch:
  push:
    branches: [investimentos-territoriais-sp645-20261111]
    paths:
      - .github/workflows/sp645-siafem-pilot-qa.yml
      - pipeline/qa/qa_sp_siafem_pilot.py
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
      SOURCE_SHA: f4123863841c4cbe21daa59171e45b391b5e99a843c7affc0b668686a1e22977
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler amostra ja preservada em R2 com hash
        run: |
          python deployment/download_r2_source.py \
            --object-key "sp_645/estadual/siafem/pilotos/ribeirao_preto/2025_01/$SOURCE_SHA/raw.json" \
            --output "$RUNNER_TEMP/pilot.json" --expected-sha256 "$SOURCE_SHA"
      - name: Examinar datas e cardinalidade sem revelar valores individuais
        run: |
          python pipeline/qa/qa_sp_siafem_pilot.py --source "$RUNNER_TEMP/pilot.json"
