name: SP645 - teste consulta SIAFEM WebForms sem persistencia

on:
  workflow_dispatch:
  push:
    branches: [investimentos-territoriais-sp645-20261111]
    paths:
      - .github/workflows/sp645-siafem-webforms-probe.yml
      - pipeline/coleta/probe_sp_siafem_webforms.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar biblioteca de requisicao e parser HTML
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Consultar uma competencia e municipio sem expor dados pessoais
        run: |
          python pipeline/coleta/probe_sp_siafem_webforms.py \
            --municipio-code 0582 \
            --date-from 01/01/2025 \
            --date-to 31/01/2025
      # A pesquisa não salva dados financeiros nem altera o site ou a API.
