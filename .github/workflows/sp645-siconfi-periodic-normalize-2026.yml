name: SP645 Siconfi 2026 periodic normalized staging
on:
  push:
    branches: [investimentos-territoriais-sp645-20261111]
    paths: ['.github/workflows/sp645-siconfi-periodic-normalize-2026.yml', 'pipeline/normalize/siconfi_periodic_2026.py']
permissions:
  contents: read
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pipeline.normalize.siconfi_periodic_2026
      - name: Persist staging and verify
        run: |
          tar -czf build/siconfi-normalized.tar.gz -C build/siconfi-normalized periodic.sqlite qa.json
          sha="$(sha256sum build/siconfi-normalized.tar.gz | cut -d' ' -f1)"
          key="sp_645/federal/siconfi/periodic/2026/staging/run_${{ github.run_id }}/${sha}.tar.gz"
          python deployment/upload_r2_source.py --source build/siconfi-normalized.tar.gz --object-key "$key" --expected-sha256 "$sha" --content-type application/gzip
          python deployment/download_r2_source.py --object-key "$key" --expected-sha256 "$sha" --output build/readback.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sp645-siconfi-periodic-normalized-qa
          path: build/siconfi-normalized/qa.json
