name: SP645 Transferegov financial aggregate audit
on:
  push:
    branches: [investimentos-territoriais-sp645-20261111]
    paths:
      - '.github/workflows/sp645-transferegov-financial-audit.yml'
      - 'pipeline/acquire/sp645_transferegov_financial_audit.py'
permissions:
  contents: read
concurrency:
  group: sp645-transferegov-financial-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve the exact staged archive from private R2
        run: |
          python deployment/download_r2_source.py \
            --object-key 'sp_645/federal/transferegov/financial/staging/run_46006854691/d7c0d8758fca9434e5c348e8f2be8905d443b1737ecc31b6aaffa33ddeaf77cc.tar.gz' \
            --expected-sha256 'd7c0d8758fca9434e5c348e8f2be8905d443b1737ecc31b6aaffa33ddeaf77cc' \
            --output build/federal-financial.tar.gz
      - name: Audit event types and coverage without exporting rows
        run: |
          python -m pipeline.acquire.sp645_transferegov_financial_audit \
            --archive build/federal-financial.tar.gz \
            --geo governance/DIM_SP645_IBGE_RA_RG_RM_AU_CONSOLIDADA_2026_11_14.csv \
            --out build/audit/summary.json
      - name: Persist aggregate summary privately and verify upload
        run: |
          sha="$(sha256sum build/audit/summary.json | cut -d' ' -f1)"
          key="sp_645/federal/transferegov/financial/audit/run_${{ github.run_id }}/summary_${sha}.json"
          python deployment/upload_r2_source.py \
            --source build/audit/summary.json \
            --object-key "$key" \
            --expected-sha256 "$sha" \
            --content-type application/json
          python deployment/download_r2_source.py \
            --object-key "$key" \
            --expected-sha256 "$sha" \
            --output build/audit/readback.json
          cmp build/audit/summary.json build/audit/readback.json
      - uses: actions/upload-artifact@v4
        with:
          name: sp645-transferegov-financial-aggregate-audit
          path: build/audit/summary.json
          if-no-files-found: error
          retention-days: 14
