name: SP645 Transferegov financial staging
on:
  push:
    branches: [investimentos-territoriais-sp645-20261111]
    paths: ['.github/workflows/sp645-transferegov-financial.yml', 'pipeline/acquire/sp645_transferegov_financial.py']
permissions:
  contents: read
concurrency:
  group: sp645-transferegov-financial
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pipeline.acquire.sp645_transferegov_financial --out build/federal-financial
      - name: Persist financial staging and verify
        run: |
          tar -czf build/federal-financial.tar.gz -C build/federal-financial financial.sqlite municipio_ano.csv qa.json
          sha="$(sha256sum build/federal-financial.tar.gz | cut -d' ' -f1)"
          key="sp_645/federal/transferegov/financial/staging/run_${{ github.run_id }}/${sha}.tar.gz"
          python deployment/upload_r2_source.py --source build/federal-financial.tar.gz --object-key "$key" --expected-sha256 "$sha" --content-type application/gzip
          python deployment/download_r2_source.py --object-key "$key" --expected-sha256 "$sha" --output build/readback.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sp645-transferegov-financial-qa
          path: build/federal-financial/qa.json
