name: TCESP 2026 revalidate existing snapshots
on:
  push:
    branches: [investimentos-territoriais-sp645-20261111]
    paths: ['.github/workflows/tcesp-2026-revalidate-existing.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revalidate both archived snapshots without TCESP queries
        run: |
          python - <<'PY'
          import os,json,hashlib,tarfile,pathlib,collections,csv
          from deployment.download_r2_source import download_r2_object
          root=pathlib.Path('build/tcesp-audit');root.mkdir(parents=True,exist_ok=True)
          def get(key,path):
              download_r2_object(account_id=os.environ['CLOUDFLARE_ACCOUNT_ID'],api_token=os.environ['CLOUDFLARE_API_TOKEN'],bucket=os.environ['CLOUDFLARE_R2_BUCKET'],object_key=key,output=path)
          def sha(b):return hashlib.sha256(b).hexdigest()
          rows=[]
          for name,prefix in [('rmrp','tcesp/rmrp/2026/run_40229219185'),('sao_carlos','tcesp/sao-carlos/2023_2026/acervo_20261025')]:
              m=root/(name+'.json');a=root/(name+'.tar.gz')
              get(prefix+'/manifest.json',m);manifest=json.loads(m.read_text())
              get(prefix+'/extratos.tar.gz',a);assert sha(a.read_bytes())==manifest['archive_sha256']
              print('ARCHIVE_VERIFIED',name,manifest['archive_sha256'],sha(m.read_bytes()))
              entries=manifest['documentos'] if name=='rmrp' else manifest['items']
              with tarfile.open(a) as tf:
                  for e in entries:
                      raw=tf.extractfile(e['path']).read()
                      assert sha(raw)==(e['json_sha256'] if name=='rmrp' else e['sha256'])
                      x=json.loads(raw)
                      if e['ano']!=2026:continue
                      code=e.get('codigo_ibge','3548906')
                      months=x.get('meses_observados',x.get('meses_presentes',x.get('meses',[])))
                      row={'codigo_ibge':code,'domain':e['dominio'],'source':name,'path':e['path'],'sha256':sha(raw),'months_raw':months,'last_month_manifest':e.get('ultimo_mes'),'fields':sorted(x.keys()),'capture':x.get('capturado_em_utc',x.get('captured_at'))}
                      if name=='rmrp':
                          assert x['codigo_ibge']==code and x['ano']==2026 and x['dominio']==e['dominio']
                          assert max(months)==e['ultimo_mes']
                          row['months_contiguous']=months==list(range(1,max(months)+1))
                      rows.append(row)
          assert len(rows)==72
          with open('governance/DIM_SP645_IBGE_RA_RG_RM_AU_CONSOLIDADA_2026_11_14.csv',encoding='utf-8-sig') as f: roster=list(csv.DictReader(f,delimiter=';'))
          rmrp={r['codigo_ibge'] for r in roster if r['rm_au_nome']=='Região Metropolitana de Ribeirão Preto'}
          assert len(rmrp)==34
          assert {(r['codigo_ibge'],r['domain']) for r in rows if r['source']=='rmrp'}=={(c,d) for c in rmrp for d in ('receitas','despesas')}
          priority={'3505609','3518602','3533601','3534302','3539509','3544905','3553203','3553658'}
          report={'archive_documents_verified':84,'2026_products':72,'rmrp_pairs':68,'sao_carlos_products':4,'rmrp_month_distribution':[{'domain':k[0],'last_month':k[1],'count':v} for k,v in sorted(collections.Counter((r['domain'],r['last_month_manifest']) for r in rows if r['source']=='rmrp').items())],'priority_rmrp':[r for r in rows if r['codigo_ibge'] in priority],'sao_carlos':[r for r in rows if r['source']=='sao_carlos'],'publication_authorized':False}
          (root/'coverage.json').write_text(json.dumps({'summary':report,'records':rows},ensure_ascii=False,indent=2))
          print('TCESP_2026_REVALIDATION',json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcesp-2026-revalidated-coverage
          path: build/tcesp-audit/coverage.json
          retention-days: 30
