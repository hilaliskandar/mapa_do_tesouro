name: TCESP investimentos API v2 - preview integrada
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tcesp-api-v2-preview-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve approved source QA artifacts for all years
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40262193781" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40263996213" --jq .conclusion)" = success
          for year in 2023 2024 2025; do
            mkdir -p "build/tcesp/$year"
            if [ "$year" = 2025 ]; then run=40262193781; else run=40263996213; fi
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "tcesp-despesas-$year-integral-qa" --dir "build/tcesp/$year"
          done
      - name: Prepare disposable SQLite with canonical schema
        run: |
          python3 - <<'PY'
          import json,sqlite3,pathlib
          db=sqlite3.connect('build/tcesp-2023-2025-dev.sqlite')
          for script in sorted(pathlib.Path('data/schema').glob('[0-9][0-9][0-9]_*.sql')):
              db.executescript(script.read_text(encoding='utf-8'))
          qa=[json.loads((pathlib.Path('build/tcesp')/str(y)/'qa.json').read_text(encoding='utf-8')) for y in [2023,2024,2025]]
          expected=set(qa[0]['codes'])
          assert len(expected)==644
          assert all(set(q['codes'])==expected and q['status']=='pass' and q['difference_count']==0 and q['issues']=={} for q in qa)
          db.executemany('INSERT INTO municipio(codigo_ibge,nome,uf) VALUES(?,?,?)',[(c,c,'SP') for c in sorted(expected)])
          db.commit();db.close()
          PY
      - name: Import all approved years with independent audit per source
        shell: bash
        run: |
          set -euo pipefail
          for year in 2023 2024 2025; do
            if [ "$year" = 2025 ]; then run=40262193781; else run=40263996213; fi
            python3 pipeline/build/import_tcesp_investimentos.py --database build/tcesp-2023-2025-dev.sqlite --source "build/tcesp/$year" --year "$year" --source-run "$run"
          done
      - name: Validate years, foreign keys and canonical isolation
        run: |
          python3 - <<'PY'
          import sqlite3,json,pathlib
          con=sqlite3.connect('build/tcesp-2023-2025-dev.sqlite')
          assert con.execute('PRAGMA foreign_key_check').fetchall()==[]
          assert con.execute('SELECT count(*) FROM observacao').fetchone()[0]==0
          assert con.execute('SELECT count(*) FROM tcesp_lote').fetchone()[0]==3
          result=[]
          for year in (2023,2024,2025):
              qa=json.loads((pathlib.Path('build/tcesp')/str(year)/'qa.json').read_text(encoding='utf-8'))
              nprog=con.execute('SELECT count(*) FROM tcesp_investimento_programa p JOIN tcesp_lote l USING(lote_id) WHERE l.exercicio=?',(year,)).fetchone()[0]
              nacao=con.execute('SELECT count(*) FROM tcesp_investimento_acao a JOIN tcesp_lote l USING(lote_id) WHERE l.exercicio=?',(year,)).fetchone()[0]
              assert (nprog,nacao)==(qa['programs'],qa['actions'])
              totals=con.execute("SELECT SUM(valor_centavos) FROM tcesp_investimento_programa p JOIN tcesp_lote l USING(lote_id) WHERE l.exercicio=? AND p.estagio='valor liquidado'",(year,)).fetchone()[0]
              assert totals==qa['stage_liquidado_cents']
              result.append({'year':year,'programs':nprog,'actions':nacao,'investimento_liquidado_centavos':totals,'qa':'pass'})
          print(json.dumps({'status':'pass','canonical_observations':0,'years':result},ensure_ascii=False))
          PY

      - name: Export isolated preview API v2
        run: python3 pipeline/build/export_tcesp_investimentos_api_v2.py --database build/tcesp-2023-2025-dev.sqlite --output build/tcesp-preview
      - name: Inspect preview API outputs without public release
        run: |
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path('build/tcesp-preview/data/api/v2/tcesp')
          assert len(list(root.glob('*/municipios/*.json')))==1932
          assert [json.loads((root/str(y)/'municipios.json').read_text())['year'] for y in [2023,2024,2025]]==[2023,2024,2025]
          assert (root/'manifest.json').exists()
          print('TCESP API v2 preview PASS')
          PY
