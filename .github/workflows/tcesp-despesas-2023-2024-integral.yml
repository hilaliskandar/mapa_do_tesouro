name: TCESP despesas estaduais 2023 2024 - auditoria integral
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tcesp-despesas-2023-2024-integral.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        year: [2023, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify disk
        run: df -h .
      - name: Process entire official statewide CSV and reconcile investment stages
        run: python3 -u governance/auditar_despesas_estaduais_historico_integral.py ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcesp-despesas-${{ matrix.year }}-integral-qa
          path: |
            build/tcesp-despesas-${{ matrix.year }}-integral/qa.json
            build/tcesp-despesas-${{ matrix.year }}-integral/investimentos_grupo44_por_municipio_mes_estagio.csv
            build/tcesp-despesas-${{ matrix.year }}-integral/investimentos_grupo44_por_programa.csv
            build/tcesp-despesas-${{ matrix.year }}-integral/investimentos_grupo44_por_acao.csv
          if-no-files-found: warn
          retention-days: 30
