name: TCESP despesas 2025 - amostra programas e acoes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tcesp-despesas-2025-amostra-programas.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 governance/probe_despesas_2025_programas_acoes_amostra.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcesp-despesas-2025-amostra-programas
          path: build/tcesp-despesas-2025-mostra/qa.json
          retention-days: 30
          if-no-files-found: warn
