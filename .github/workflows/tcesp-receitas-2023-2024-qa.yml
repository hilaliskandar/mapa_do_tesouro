name: TCESP receitas historicas 2023 2024 - QA integral
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tcesp-receitas-2023-2024-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        year: [2023, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read all official statewide revenues without ingesting
        run: python3 governance/auditar_tcesp_receitas_estaduais_historico.py ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcesp-receitas-${{ matrix.year }}-full-qa
          path: build/tcesp-receitas-${{ matrix.year }}-full-qa/qa.json
          if-no-files-found: warn
          retention-days: 30
