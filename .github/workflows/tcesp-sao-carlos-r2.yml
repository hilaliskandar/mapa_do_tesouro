name: TCESP Sao Carlos - persistir acervo existente R2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tcesp-sao-carlos-r2.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_BUCKET: financas-municipais-sp-canonico
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve existing artifacts only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          for item in "40213455640 sao-carlos-tcesp-2023-2026" "40222584058 sao-carlos-tcesp-detalhe-2023-2026" "40226770931 sao-carlos-receitas-tcesp-esquema-2023-2026" "40226826428 sao-carlos-tributos-2023-2026"; do
            set -- $item
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1" --jq .conclusion)" = success
            mkdir -p "build/source/$2"
            gh run download "$1" --repo "$GITHUB_REPOSITORY" --name "$2" --dir "build/source/$2"
          done
      - name: Validate and archive with manifest
        shell: bash
        run: |
          python3 editorial/sao_carlos/empacotar_acervo_existente.py --input build/source --output build/package
      - name: Upload immutable private archive
        shell: bash
        run: |
          SHA="$(python3 -c 'import json;print(json.load(open("build/package/manifest.json"))["archive_sha256"])')"
          python3 deployment/upload_r2_source.py --source build/package/sao_carlos_tcesp_2023_2026.tar.gz --object-key tcesp/sao-carlos/2023_2026/acervo_20261025/extratos.tar.gz --content-type application/gzip --expected-sha256 "$SHA"
      - name: Upload metadata
        run: python3 deployment/upload_r2_source.py --source build/package/manifest.json --object-key tcesp/sao-carlos/2023_2026/acervo_20261025/manifest.json --content-type application/json
      - name: Verify readback
        shell: bash
        run: |
          SHA="$(python3 -c 'import json;print(json.load(open("build/package/manifest.json"))["archive_sha256"])')"
          python3 deployment/download_r2_source.py --object-key tcesp/sao-carlos/2023_2026/acervo_20261025/extratos.tar.gz --output build/verified.tar.gz --expected-sha256 "$SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sao-carlos-tcesp-r2-manifest
          path: build/package/manifest.json
          if-no-files-found: warn
          retention-days: 30
