name: TCESP receitas Sao Carlos 2025 - comparacao corrigida
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tcesp-sao-carlos-receitas-2025.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare official monthly revenue totals
        run: python3 governance/verificar_sao_carlos_receitas_2025.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcesp-sao-carlos-receitas-2025
          path: build/tcesp-receitas-sao-carlos-2025/auditoria.json
          retention-days: 30
