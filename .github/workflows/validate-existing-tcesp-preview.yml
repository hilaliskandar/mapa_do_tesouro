name: Validate integrated TCESP preview immutable URL without redeploy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-existing-tcesp-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate native fiscal SP645 API and page
        run: |
          python3 deployment/qa_remote_sp645_v2_json.py --url https://sp645-tcesp-qa-20261026.finbra-tic-tim-referencia.pages.dev --report build/integrated-fiscal-v2.json
          python3 deployment/qa_sp645_pages.py --url https://sp645-tcesp-qa-20261026.finbra-tic-tim-referencia.pages.dev
      - name: Validate three exercises and individual TCESP payload content
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,pathlib,time
          base='https://47141558.finbra-tic-tim-referencia.pages.dev'
          def get(path):
           for attempt in range(4):
            try:
             req=urllib.request.Request(base+path,headers={'User-Agent':'sp645-tcesp-qa/1','Accept':'application/json'})
             with urllib.request.urlopen(req,timeout=45) as r:
              assert r.status==200 and 'json' in r.headers.get('Content-Type','').lower(),(path,r.status)
              return json.load(r)
            except urllib.error.HTTPError as e:
             if e.code not in (403,429,502,503) or attempt==3:raise
             time.sleep(3*(attempt+1))
          manifest=get('/data/api/v2/tcesp/manifest.json')
          assert manifest['status']=='preview_not_published'
          assert [z['exercicio'] for z in manifest['exercises']]==[2023,2024,2025]
          years=[]
          for y in (2023,2024,2025):
           aggregate=get(f'/data/api/v2/tcesp/{y}/municipios.json')
           detail=get(f'/data/api/v2/tcesp/{y}/municipios/3525904.json')
           assert detail['ano']==y and detail['codigo_ibge']=='3525904'
           assert len(detail['programas'])>0 and len(detail['acoes'])>0
           assert len({r['codigo_ibge'] for r in aggregate['rows']})==644
           years.append({'year':y,'program_rows':len(detail['programas']),'action_rows':len(detail['acoes'])})
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/tcesp-remote-contract.json').write_text(json.dumps({'status':'pass','annual':years},indent=2))
          print(json.dumps(years))
          PY
      - name: Chromium external UI interactions
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import json,pathlib
          url='https://sp645-tcesp-qa-20261026.finbra-tic-tim-referencia.pages.dev/tcesp-investimentos.html'
          with sync_playwright() as p:
           browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
           page=browser.new_page()
           errors=[];page.on('pageerror',lambda err:errors.append(str(err)))
           page.goto(url,wait_until='domcontentloaded',timeout=60000)
           page.locator('#status').get_by_text('Consulta concluída.').wait_for(timeout=60000)
           assert page.locator('#resultado tr').count()>0
           page.locator('#nivel').select_option('acoes')
           assert page.locator('#resultado tr').count()>0
           page.locator('#ano').select_option('2023')
           page.locator('#consultar').click()
           page.locator('#status').get_by_text('Consulta concluída.').wait_for(timeout=60000)
           assert page.locator('#resultado tr').count()>0
           assert errors==[],errors
           browser.close()
          pathlib.Path('build/tcesp-external-browser.json').write_text(json.dumps({'status':'pass','errors':errors}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-tcesp-external-contract
          path: |
            build/integrated-fiscal-v2.json
            build/tcesp-remote-contract.json
            build/tcesp-external-browser.json
          if-no-files-found: warn
