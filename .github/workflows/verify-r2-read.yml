name: Bootstrap SP 645 pilot to R2

on:
  push:
    branches:
      - r2-canonical-source-rebuild

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook dependency
        run: pip install openpyxl

      - name: Download authenticated temporary source
        shell: bash
        run: |
          curl --fail --location --retry 2 --retry-delay 2 \
            "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b800-820e-a5f3-b72019239c54/raw?se=2026-10-07T20%3A31%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=367208e4-0147-5610-bc67-cee28c52b6d3&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T11%3A54%3A00Z&ske=2026-10-08T11%3A54%3A00Z&sks=b&skv=2026-02-06&sig=O5WTazZ86o6cZJNshe7xHlM4DISb8QAQlwaT/pgmwFQ%3D" \
            --output source.xlsx
          echo "d5c24c19418cd96e86b32339f0949ff731b1e35e95eb6e9c66f0ed06049d49fa  source.xlsx" | sha256sum --check -

      - name: Build deterministic statewide pilot
        shell: bash
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from pathlib import Path
          import csv, gzip, hashlib, io

          source=Path("source.xlsx")
          wb=load_workbook(source, read_only=True, data_only=True)
          ws=wb["Base_Analitica"]
          rows=ws.iter_rows(values_only=True)
          headers=list(next(rows))
          idx={name:i for i,name in enumerate(headers)}
          cols=[
              ("cod_ibge","cod_ibge"),
              ("municipio","municipio"),
              ("ano","ano_finbra"),
              ("dca_receita_corrente_bruta","receitas_correntes"),
              ("dca_receita_tributaria_bruta","receita_tributaria_total"),
              ("dca_iptu_principal","iptu"),
              ("dca_itbi_principal","itbi"),
              ("dca_iss_principal","iss"),
          ]
          buf=io.StringIO(newline="")
          writer=csv.writer(buf)
          writer.writerow([out for out,_ in cols])
          count=0
          municipalities=set()
          years=set()
          for row in rows:
              values=[]
              for out,src in cols:
                  value=row[idx[src]]
                  if out=="ano":
                      value=int(value)
                  values.append(value)
              writer.writerow(values)
              count += 1
              municipalities.add(str(values[0]))
              years.add(int(values[2]))

          if count != 2580 or len(municipalities) != 645 or years != {2020,2021,2022,2023}:
              raise SystemExit((count, len(municipalities), sorted(years)))

          csv_bytes=b"\xef\xbb\xbf"+buf.getvalue().encode("utf-8")
          csv_sha=hashlib.sha256(csv_bytes).hexdigest()
          expected_csv="1bc6b7a32585c111aa2d25f2cabe794ce6bf6550c2ba1e26ab136806b7a94626"
          if csv_sha != expected_csv:
              raise SystemExit(f"csv sha mismatch: {csv_sha}")

          compressed=io.BytesIO()
          with gzip.GzipFile(fileobj=compressed, mode="wb", filename="", mtime=0, compresslevel=9) as gz:
              gz.write(csv_bytes)
          gz_bytes=compressed.getvalue()
          gz_sha=hashlib.sha256(gz_bytes).hexdigest()
          expected_gz="3f5ebf5a6482b7627cd2c1bd121c722e53e2632fed2340ae5ccae7e02290088a"
          if gz_sha != expected_gz:
              raise SystemExit(f"gzip sha mismatch: {gz_sha}")
          Path("snapshot.csv.gz").write_bytes(gz_bytes)
          print("pilot rows=2580 municipalities=645 years=2020-2023")
          print("csv_sha256="+csv_sha)
          print("gzip_sha256="+gz_sha)
          PY

      - name: Upload private snapshot to R2
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/gzip" \
            --data-binary @snapshot.csv.gz \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/financas-municipais-sp-canonico/objects/sp_645/pilot_2020_2023/snapshot.csv.gz"

      - name: Verify uploaded object
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/financas-municipais-sp-canonico/objects/sp_645/pilot_2020_2023/snapshot.csv.gz" \
            --output downloaded.csv.gz
          echo "3f5ebf5a6482b7627cd2c1bd121c722e53e2632fed2340ae5ccae7e02290088a  downloaded.csv.gz" | sha256sum --check -
