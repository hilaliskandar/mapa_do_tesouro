sistema:
  nome: mapa_do_tesouro
  versao: 0.3.2
  idioma_interno: pt_br_sem_acentos

processamento:
  preservar_entrada: true
  registrar_hashes: true
  interromper_em_alerta_critico: true
  formato_intermediario: parquet

validacao:
  abas_dados:
    - Cobertura
    - Receitas
    - Despesas
    - Despesa por função
  abas_auxiliares:
    - Leia-me
    - Dicionário
    - Fontes
  extrair_anos_somente_de_coluna_explicita: true
  normalizar_acentos_em_cabecalhos: true

normalizacao:
  executar_apos_validacao: true
  formato_saida: parquet
  omitir_apenas_valores_ausentes: true
  preservar_rotulo_conta_original: true
  preservar_valor_original: true
  gerar_valor_numerico_separado: true
  usar_dicionario_como_fonte_primaria: true
  permitir_regra_contingencia: true
  reconciliar_preenchidos_com_registros_longos: true
  reprovar_duplicidades_contabeis: true
  reprovar_inconsistencia_populacional: true
  separar_populacao_das_contas: true
  arquivo_dimensao_municipio_ano: dimensao_municipio_ano.parquet
  identificadores_padrao:
    - uf
    - codigo_ibge
    - municipio
    - ano
    - populacao
  abas_em_formato_longo:
    - Receitas
    - Despesas
    - Despesa por função
  abas_auxiliares_preservadas:
    - Leia-me
    - Cobertura
    - Dicionário
    - Fontes

cartografia:
  provedor: geojson_remoto
  url: https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-100-mun.json
  arquivo_cache: dados/cartografia/cache/geojs-100-mun.json
  campo_codigo: id
  campo_nome: name
  sistema_referencia: EPSG:4326
  fonte: tbrugz/geodata-br
  credito: "Base cartografica derivada disponibilizada por tbrugz/geodata-br"
  uso: prototipo
  permitir_substituicao_fonte: true
  atualizar_cache_automaticamente: false
  tempo_limite_download_segundos: 120

valores_monetarios:
  indice: IPCA
  mes_base: 2026-06
  referencia_anual: dezembro
  manter_valores_nominais: true
  gerar_valores_reais: true

relatorios:
  formatos:
    - html
    - pdf
    - xlsx
  gerar_por_etapa: true
  gerar_consolidado: true
