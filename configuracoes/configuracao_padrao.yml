sistema:
  nome: mapa_do_tesouro
  versao: 0.1.1
  idioma_interno: pt_br_sem_acentos

processamento:
  preservar_entrada: true
  registrar_hashes: true
  interromper_em_alerta_critico: true
  formato_intermediario: parquet

cartografia:
  provedor: geojson_remoto
  url: https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-100-mun.json
  arquivo_cache: dados/cartografia/cache/geojs-100-mun.json
  campo_codigo: id
  campo_nome: name
  sistema_referencia: EPSG:4326
  fonte: tbrugz/geodata-br
  credito: "Base cartografica derivada disponibilizada por tbrugz/geodata-br"
  uso: prototipo
  permitir_substituicao_fonte: true
  atualizar_cache_automaticamente: false
  tempo_limite_download_segundos: 120

valores_monetarios:
  indice: IPCA
  mes_base: 2026-06
  referencia_anual: dezembro
  manter_valores_nominais: true
  gerar_valores_reais: true

relatorios:
  formatos:
    - html
    - pdf
    - xlsx
  gerar_por_etapa: true
  gerar_consolidado: true
