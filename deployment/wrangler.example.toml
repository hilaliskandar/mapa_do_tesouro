# Exemplo público para alternativa Workers Static Assets.
# Para a primeira publicação estática, prefira Cloudflare Pages Direct Upload:
#   npx wrangler pages deploy build/site --project-name=<PROJECT_NAME>
#
# Copie este arquivo para wrangler.toml somente em ambiente local/privado.
# Não versione o wrangler.toml real.

name = "financas-municipais-sp"
compatibility_date = "2026-10-07"
workers_dev = false

[assets]
directory = "./build/site"
run_worker_first = false

# Não há Worker, D1 ou R2 na publicação estática inicial.
# Bindings dinâmicos devem ser acrescentados apenas quando houver
# requisito funcional que não possa ser atendido pelos artefatos static-first.
