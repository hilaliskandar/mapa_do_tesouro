<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-label="Quadro Q4, matriz SWOT da sub-região de Ribeirão Preto, quatro quadrantes, síntese estratégica e gráfico do índice real de investimentos">
 <rect width="1600" height="1180" fill="#f8fafc"/>
 <rect x="28" y="28" width="1544" height="1124" rx="16" fill="#ffffff" stroke="#d8e1ec"/>
 <rect x="53" y="54" width="10" height="117" rx="4" fill="#16405e"/>
 <text x="86" y="105" fill="#12243d" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" text-anchor="start">Quadro Q4 — Matriz SWOT</text>
 <text x="86" y="155" fill="#173a58" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="600" text-anchor="start">Sub-região de Ribeirão Preto</text>
 <rect x="1055" y="60" width="471" height="109" rx="12" fill="#e7eef6" stroke="#bbcadc"/>
 <text x="1078" y="98" fill="#183d5b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Municípios: 15</text>
 <text x="1078" y="131" fill="#183d5b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Queda real agregada: 38,82%</text>
 <text x="65" y="215" fill="#5d7084" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="start">FINANÇAS MUNICIPAIS • INVESTIMENTOS • DIFERENCIAÇÃO TERRITORIAL</text>
 <rect x="65" y="244" width="722" height="255" rx="12" fill="#fff" stroke="#43895e" stroke-width="2"/><path d="M 77 244 h 698 q 12 0 12 12 v 48 h -722 v -48 q 0 -12 12 -12" fill="#e6f3e8"/><text x="91" y="284" fill="#112e48" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">FORÇAS</text><text x="92" y="337" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">A sub-região reúne a maior concentração identificada de</text><text x="92" y="364" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">investimentos no município-polo e a exceção de Cravinhos,</text><text x="92" y="391" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">único município com expansão nominal nos dois intervalos do</text><text x="92" y="418" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">triênio. A diversidade de escala e de intensidade oferece</text><text x="92" y="445" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">base para estratégias territoriais diferenciadas.</text>
 <rect x="813" y="244" width="722" height="255" rx="12" fill="#fff" stroke="#b65b58" stroke-width="2"/><path d="M 825 244 h 698 q 12 0 12 12 v 48 h -722 v -48 q 0 -12 12 -12" fill="#f9e7e4"/><text x="839" y="284" fill="#112e48" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">FRAQUEZAS</text><text x="840" y="337" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">A concentração dos montantes no polo expõe o agregado à sua</text><text x="840" y="364" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">oscilação anual. Em diversos municípios, a execução de</text><text x="840" y="391" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">capital recuou muito mais que a receita corrente, com</text><text x="840" y="418" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">participação inferior a 1% em 2025; a situação de</text><text x="840" y="445" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Jardinópolis, Pontal e São Simão é especialmente relevante</text><text x="840" y="472" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">para uma análise de continuidade de obras e equipamentos.</text>
 <rect x="65" y="519" width="722" height="228" rx="12" fill="#fff" stroke="#3a7ca8" stroke-width="2"/><path d="M 77 519 h 698 q 12 0 12 12 v 48 h -722 v -48 q 0 -12 12 -12" fill="#e6f1fa"/><text x="91" y="559" fill="#112e48" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">OPORTUNIDADES</text><text x="92" y="612" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Cooperação entre municípios próximos para estruturar projetos</text><text x="92" y="639" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">compartilhados, quando demonstrada sua viabilidade técnica e</text><text x="92" y="666" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">institucional, pode diminuir custos de preparação e ampliar</text><text x="92" y="693" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">escala de serviços. A existência dessa alternativa não</text><text x="92" y="720" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">constitui evidência de carteira contratada.</text>
 <rect x="813" y="519" width="722" height="228" rx="12" fill="#fff" stroke="#c19534" stroke-width="2"/><path d="M 825 519 h 698 q 12 0 12 12 v 48 h -722 v -48 q 0 -12 12 -12" fill="#fff2d9"/><text x="839" y="559" fill="#112e48" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">AMEAÇAS</text><text x="840" y="612" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">A eventual redução ou atraso de recursos externos vinculados</text><text x="840" y="639" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">a projetos específicos pode afetar municípios com baixa</text><text x="840" y="666" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">intensidade de investimento e execução volátil. Alterações na</text><text x="840" y="693" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">agenda de obras do polo também podem modificar a leitura</text><text x="840" y="720" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">regional sem se reproduzir em cada município.</text>
 <rect x="65" y="768" width="1470" height="152" rx="12" fill="#edf3f9" stroke="#bfcde0"/>
 <text x="89" y="804" fill="#1f425e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">INVESTIMENTOS REAIS AGREGADOS · ÍNDICE 2023 = 100</text>
 <text x="106" y="851" fill="#203a54" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="start">2023</text>
 <rect x="174" y="826" width="1030" height="28" rx="5" fill="#d7e6f3"/>
 <rect x="174" y="826" width="1030" height="28" rx="5" fill="#17517a"/>
 <text x="1226" y="850" fill="#19344d" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">100,00</text>
 <text x="106" y="891" fill="#203a54" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="start">2025</text>
 <rect x="174" y="865" width="1030" height="28" rx="5" fill="#d7e6f3"/>
 <rect x="174" y="865" width="630.2" height="28" rx="5" fill="#4b97bd"/>
 <text x="1226" y="890" fill="#19344d" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">61,18</text>
 <text x="89" y="938" fill="#a23f37" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">Variação de 2023 a 2025: −38,82%</text>
 <rect x="65" y="965" width="1470" height="139" rx="12" fill="#e8eef6"/>
 <text x="88" y="1001" fill="#15334f" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">SÍNTESE ESTRATÉGICA</text>
 <text x="89" y="1035" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">O planejamento sub-regional precisa monitorar separadamente o volume de Ribeirão Preto e a evolução dos municípios</text><text x="89" y="1058" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">menores, evitando que a escala do polo oculte situações de investimento residual. A participação contábil observada</text><text x="89" y="1081" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">de ISS e ICMS não constitui projeção da receita futura do IBS.</text>
 <line x1="68" y1="1120" x2="1527" y2="1120" stroke="#8298af"/>
 <text x="75" y="1146" fill="#46596b" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Fonte: Volume II — Finanças municipais da RMRP, G30 RC1 (2026). Valores reais agregados; não confundir com variação per capita.</text>
 </svg>