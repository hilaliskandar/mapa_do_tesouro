<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-label="Quadro Q7, matriz SWOT da sub-região de Batatais, quatro quadrantes, síntese estratégica e gráfico do índice real de investimentos">
 <rect width="1600" height="1180" fill="#f8fafc"/>
 <rect x="28" y="28" width="1544" height="1124" rx="16" fill="#ffffff" stroke="#d8e1ec"/>
 <rect x="53" y="54" width="10" height="117" rx="4" fill="#16405e"/>
 <text x="86" y="105" fill="#12243d" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" text-anchor="start">Quadro Q7 — Matriz SWOT</text>
 <text x="86" y="155" fill="#173a58" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="600" text-anchor="start">Sub-região de Batatais</text>
 <rect x="1055" y="60" width="471" height="109" rx="12" fill="#e7eef6" stroke="#bbcadc"/>
 <text x="1078" y="98" fill="#183d5b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Municípios: 7</text>
 <text x="1078" y="131" fill="#183d5b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">Queda real agregada: 56,50%</text>
 <text x="65" y="215" fill="#5d7084" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="start">FINANÇAS MUNICIPAIS • INVESTIMENTOS • DIFERENCIAÇÃO TERRITORIAL</text>
 <rect x="65" y="244" width="722" height="255" rx="12" fill="#fff" stroke="#43895e" stroke-width="2"/><path d="M 77 244 h 698 q 12 0 12 12 v 48 h -722 v -48 q 0 -12 12 -12" fill="#e6f3e8"/><text x="91" y="284" fill="#112e48" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">FORÇAS</text><text x="92" y="337" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">A intensidade relativa dos investimentos em Nuporanga,</text><text x="92" y="364" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">superior à média sub-regional em 2025, demonstra que o</text><text x="92" y="391" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">conjunto não é homogêneo. Em alguns municípios, as receitas</text><text x="92" y="418" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">correntes apresentaram crescimento real, o que diferencia</text><text x="92" y="445" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">restrição de receita agregada de redução da aplicação em</text><text x="92" y="472" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">capital.</text>
 <rect x="813" y="244" width="722" height="255" rx="12" fill="#fff" stroke="#b65b58" stroke-width="2"/><path d="M 825 244 h 698 q 12 0 12 12 v 48 h -722 v -48 q 0 -12 12 -12" fill="#f9e7e4"/><text x="839" y="284" fill="#112e48" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">FRAQUEZAS</text><text x="840" y="337" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">A retração real agregada foi a mais profunda da RMRP.</text><text x="840" y="364" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Altinópolis e Sales Oliveira encerraram 2025 com</text><text x="840" y="391" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">investimentos inferiores a 1% da receita corrente; Morro</text><text x="840" y="418" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Agudo apresentou queda nominal contínua e perda significativa</text><text x="840" y="445" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">de intensidade.</text>
 <rect x="65" y="519" width="722" height="228" rx="12" fill="#fff" stroke="#3a7ca8" stroke-width="2"/><path d="M 77 519 h 698 q 12 0 12 12 v 48 h -722 v -48 q 0 -12 12 -12" fill="#e6f1fa"/><text x="91" y="559" fill="#112e48" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">OPORTUNIDADES</text><text x="92" y="612" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">O ordenamento de prioridades e a preparação de projetos de</text><text x="92" y="639" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">execução plurianual podem contribuir para reduzir a</text><text x="92" y="666" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">dependência de picos orçamentários, desde que amparados em</text><text x="92" y="693" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">diagnósticos setoriais e fontes viáveis de financiamento.</text>
 <rect x="813" y="519" width="722" height="228" rx="12" fill="#fff" stroke="#c19534" stroke-width="2"/><path d="M 825 519 h 698 q 12 0 12 12 v 48 h -722 v -48 q 0 -12 12 -12" fill="#fff2d9"/><text x="839" y="559" fill="#112e48" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">AMEAÇAS</text><text x="840" y="612" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Atrasos em transferências discricionárias ou aumentos de</text><text x="840" y="639" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">custos de projetos poderiam aprofundar a descontinuidade da</text><text x="840" y="666" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">execução, sobretudo onde a intensidade de investimentos já</text><text x="840" y="693" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">terminou o triênio em patamar muito baixo.</text>
 <rect x="65" y="768" width="1470" height="152" rx="12" fill="#edf3f9" stroke="#bfcde0"/>
 <text x="89" y="804" fill="#1f425e" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">INVESTIMENTOS REAIS AGREGADOS · ÍNDICE 2023 = 100</text>
 <text x="106" y="851" fill="#203a54" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="start">2023</text>
 <rect x="174" y="826" width="1030" height="28" rx="5" fill="#d7e6f3"/>
 <rect x="174" y="826" width="1030" height="28" rx="5" fill="#17517a"/>
 <text x="1226" y="850" fill="#19344d" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">100,00</text>
 <text x="106" y="891" fill="#203a54" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" text-anchor="start">2025</text>
 <rect x="174" y="865" width="1030" height="28" rx="5" fill="#d7e6f3"/>
 <rect x="174" y="865" width="448.1" height="28" rx="5" fill="#4b97bd"/>
 <text x="1226" y="890" fill="#19344d" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">43,50</text>
 <text x="89" y="938" fill="#a23f37" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">Variação de 2023 a 2025: −56,50%</text>
 <rect x="65" y="965" width="1470" height="139" rx="12" fill="#e8eef6"/>
 <text x="88" y="1001" fill="#15334f" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">SÍNTESE ESTRATÉGICA</text>
 <text x="89" y="1039" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">A comparação entre Nuporanga e os municípios de execução residual mostra que a trajetória temporal e a posição</text><text x="89" y="1066" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">relativa em 2025 devem ser acompanhadas simultaneamente, sob pena de se ocultar a heterogeneidade do grupo. A</text><text x="89" y="1093" fill="#182d45" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">participação contábil observada de ISS e ICMS não constitui projeção da receita futura do IBS.</text>
 <line x1="68" y1="1120" x2="1527" y2="1120" stroke="#8298af"/>
 <text x="75" y="1146" fill="#46596b" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Fonte: Volume II — Finanças municipais da RMRP, G30 RC1 (2026). Valores reais agregados; não confundir com variação per capita.</text>
 </svg>