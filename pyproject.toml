[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapa-do-tesouro"
version = "0.2.1"
description = "Aplicacao auditavel para processamento, analise e cartografia de financas municipais."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.37",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "geopandas>=1.0",
  "shapely>=2.0",
  "matplotlib>=3.9",
  "mapclassify>=2.8",
  "jinja2>=3.1",
  "weasyprint>=62",
  "pyarrow>=17",
  "requests>=2.32",
]

[project.optional-dependencies]
desenvolvimento = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["testes"]
python_files = ["teste_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["nucleo*", "processamentos*", "relatorios*", "interface*"]
