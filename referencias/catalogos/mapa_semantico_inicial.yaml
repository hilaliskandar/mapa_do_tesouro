versao: 2
nome: mapa_semantico_inicial
observacao: >-
  Catalogo inicial versionado. As regras nao substituem ementarios anuais nem
  mapeamentos fiscais oficiais. O objetivo e preservar conceitos atomicos e
  permitir cobertura auditavel antes da construcao dos agregados.
parametros:
  blocos_obrigatorios: [receitas, despesas, despesa_por_funcao]
  cobertura_minima_alerta: 0.15
regras:
  - id_semantico: REV_TRIB_IPTU_PRINCIPAL
    grupo_semantico: receita_tributaria
    bloco: receitas
    nivel_semantico: conta_especifica
    finalidade: indicador
    prioridade: 100
    confianca: alta
    descricao_contem_algum: ["iptu", "propriedade predial e territorial urbana"]
    descricao_nao_contem: ["multa", "juros", "divida ativa"]
    interpretacao: Arrecadacao principal do IPTU.
  - id_semantico: REV_TRIB_ISS_PRINCIPAL
    grupo_semantico: receita_tributaria
    bloco: receitas
    nivel_semantico: conta_especifica
    finalidade: indicador
    prioridade: 100
    confianca: alta
    descricao_contem_algum: ["imposto sobre servicos", "issqn", "iss"]
    descricao_nao_contem: ["multa", "juros", "divida ativa"]
    interpretacao: Arrecadacao principal do imposto sobre servicos.
  - id_semantico: REV_TRIB_ITBI_PRINCIPAL
    grupo_semantico: receita_tributaria
    bloco: receitas
    nivel_semantico: conta_especifica
    finalidade: indicador
    prioridade: 100
    confianca: alta
    descricao_contem_algum: ["itbi", "transmissao inter vivos"]
    descricao_nao_contem: ["multa", "juros", "divida ativa"]
    interpretacao: Arrecadacao principal do ITBI e sinal aproximado da atividade imobiliaria.
  - id_semantico: REV_TRIB_TAXAS
    grupo_semantico: receita_tributaria
    bloco: receitas
    nivel_semantico: grupo
    finalidade: composicao
    prioridade: 80
    confianca: media
    descricao_contem_algum: ["taxas", "taxa pelo exercicio", "taxa pela prestacao"]
    interpretacao: Receitas de taxas municipais.
  - id_semantico: REV_TRIB_CONTRIBUICAO_MELHORIA
    grupo_semantico: receita_tributaria
    bloco: receitas
    nivel_semantico: conta_especifica
    finalidade: indicador
    prioridade: 100
    confianca: alta
    descricao_contem_algum: ["contribuicao de melhoria"]
    interpretacao: Receita de contribuicao de melhoria.
  - id_semantico: REV_TRANSF_FPM
    grupo_semantico: transferencias_constitucionais
    bloco: receitas
    nivel_semantico: conta_especifica
    finalidade: indicador
    prioridade: 100
    confianca: alta
    descricao_contem_algum: ["fundo de participacao dos municipios", "fpm"]
    interpretacao: Transferencias do Fundo de Participacao dos Municipios.
  - id_semantico: REV_TRANSF_ICMS
    grupo_semantico: transferencias_constitucionais
    bloco: receitas
    nivel_semantico: conta_especifica
    finalidade: indicador
    prioridade: 100
    confianca: alta
    descricao_contem_algum: ["cota-parte do icms", "cota parte do icms"]
    interpretacao: Cota-parte municipal do ICMS.
  - id_semantico: REV_TRANSF_IPVA
    grupo_semantico: transferencias_constitucionais
    bloco: receitas
    nivel_semantico: conta_especifica
    finalidade: indicador
    prioridade: 100
    confianca: alta
    descricao_contem_algum: ["cota-parte do ipva", "cota parte do ipva"]
    interpretacao: Cota-parte municipal do IPVA.

  - id_semantico: DESP_CORRENTES_TOTAL
    grupo_semantico: despesa_categoria
    bloco: despesas
    nivel_semantico: categoria
    finalidade: totalizacao
    prioridade: 200
    confianca: alta
    codigo_regex: '^3(?:\.0+)*$'
    interpretacao: Total da categoria economica Despesas Correntes.
  - id_semantico: DESP_CAPITAL_TOTAL
    grupo_semantico: despesa_categoria
    bloco: despesas
    nivel_semantico: categoria
    finalidade: totalizacao
    prioridade: 200
    confianca: alta
    codigo_regex: '^4(?:\.0+)*$'
    interpretacao: Total da categoria economica Despesas de Capital.
  - id_semantico: DESP_PESSOAL_PROXY
    grupo_semantico: despesa_natureza
    bloco: despesas
    nivel_semantico: grupo
    finalidade: composicao
    prioridade: 100
    confianca: alta
    codigo_regex: '^3\.1(?:\.|$)'
    interpretacao: Grupo 3.1, proxy contabil de pessoal e encargos; nao equivale a DTP-LRF.
  - id_semantico: DESP_JUROS_ENCARGOS
    grupo_semantico: despesa_natureza
    bloco: despesas
    nivel_semantico: grupo
    finalidade: composicao
    prioridade: 100
    confianca: alta
    codigo_regex: '^3\.2(?:\.|$)'
    interpretacao: Juros e encargos da divida.
  - id_semantico: DESP_OUTRAS_CORRENTES
    grupo_semantico: despesa_natureza
    bloco: despesas
    nivel_semantico: grupo
    finalidade: composicao
    prioridade: 100
    confianca: alta
    codigo_regex: '^3\.3(?:\.|$)'
    interpretacao: Outras despesas correntes.
  - id_semantico: DESP_INVESTIMENTOS
    grupo_semantico: despesa_natureza
    bloco: despesas
    nivel_semantico: grupo
    finalidade: composicao
    prioridade: 100
    confianca: alta
    codigo_regex: '^4\.4(?:\.|$)'
    interpretacao: Grupo 4.4, investimentos.
  - id_semantico: DESP_INVERSOES_FINANCEIRAS
    grupo_semantico: despesa_natureza
    bloco: despesas
    nivel_semantico: grupo
    finalidade: composicao
    prioridade: 100
    confianca: alta
    codigo_regex: '^4\.5(?:\.|$)'
    interpretacao: Grupo 4.5, inversoes financeiras.
  - id_semantico: DESP_AMORTIZACAO_DIVIDA
    grupo_semantico: despesa_natureza
    bloco: despesas
    nivel_semantico: grupo
    finalidade: composicao
    prioridade: 100
    confianca: alta
    codigo_regex: '^4\.6(?:\.|$)'
    interpretacao: Grupo 4.6, amortizacao da divida.

  - {id_semantico: FUNCAO_LEGISLATIVA, grupo_semantico: despesa_funcional, bloco: despesa_por_funcao, nivel_semantico: funcao, finalidade: composicao, prioridade: 100, confianca: alta, codigo_regex: '^01(?:\.|$)', interpretacao: Funcao Legislativa.}
